# golangci-lint v2.x configuration
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Bug detectors (keep these!)
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

issues:
  # Disable default excludes to ensure our patterns work
  exclude-use-default: false

  # Exclude directories
  exclude-dirs:
    - examples/agents
    - scripts

  # Global excludes - regex patterns matching the issue text
  exclude:
    - "could merge conditional assignment"           # QF1007
    - "could use tagged switch"                      # QF1003
    - "could remove embedded field"                  # QF1008
    - "could omit type"                              # QF1011
    - "could apply De Morgan"                        # QF1001
    - "could lift into loop"                         # QF1006
    - "Use fmt.Fprintf"                              # QF1012
    - "should omit type"                             # ST1023
    - "is deprecated"                                # SA1019
    - "empty branch"                                 # SA9003
    - "possible nil pointer"                         # SA5011
    - "variadic argument.*expected to have even"     # SA5012
    - "is unused"                                    # unused test helpers

  # Exclude rules for path-specific patterns
  exclude-rules:
    # Allow underscore in package names for eval packages (M-EVAL framework)
    - path: internal/eval_harness/
      text: "don't use an underscore in package name"

    - path: internal/eval_analysis/
      text: "don't use an underscore in package name"

    - path: internal/eval_analyzer/
      text: "don't use an underscore in package name"

    # Allow ALL_CAPS for error codes (match JSON schema codes)
    - path: internal/types/errors\.go
      text: "don't use ALL_CAPS in Go names"

    - path: internal/eval_harness/errors\.go
      text: "don't use ALL_CAPS in Go names"

    - path: internal/planning/validator\.go
      text: "don't use ALL_CAPS in Go names"

  # Limit output
  max-issues-per-linter: 50
  max-same-issues: 10

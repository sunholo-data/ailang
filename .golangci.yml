# golangci-lint v2.x configuration
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Bug detectors (keep these!)
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

  settings:
    staticcheck:
      # Disable style suggestions - focus on bugs only
      checks:
        - "all"
        - "-QF*"     # Disable all QuickFix (style) suggestions
        - "-ST*"     # Disable all Style suggestions
        - "-SA1019"  # Disable deprecated warnings (tracked separately)
        - "-SA9003"  # Disable empty branch warnings
        - "-SA5011"  # Disable nil pointer (false positives)
        - "-SA5012"  # Disable variadic argument count

issues:
  # Exclude directories
  exclude-dirs:
    - examples/agents
    - scripts

  exclude-rules:
    # Allow underscore in package names for eval packages (M-EVAL framework)
    - path: internal/eval_harness/
      text: "don't use an underscore in package name"

    - path: internal/eval_analysis/
      text: "don't use an underscore in package name"

    - path: internal/eval_analyzer/
      text: "don't use an underscore in package name"

    # Allow ALL_CAPS for error codes (match JSON schema codes)
    - path: internal/types/errors\.go
      text: "don't use ALL_CAPS in Go names"

    - path: internal/eval_harness/errors\.go
      text: "don't use ALL_CAPS in Go names"

    - path: internal/planning/validator\.go
      text: "don't use ALL_CAPS in Go names"

  # Limit output
  max-issues-per-linter: 50
  max-same-issues: 10

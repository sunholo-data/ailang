sonar.projectKey=sunholo-data_ailang
sonar.organization=sunholo-data

# Go code only. The UI (ui/src) and docs components (docs/src) are iteration-
# heavy dashboards with no JS test harness — scanning them guaranteed the
# new_coverage gate failed forever (coverage.out is Go-only). The quality gate
# is the wrong tool for dashboard iteration; we keep Sonar focused on the
# shipped Go binary where tests + coverage actually exist.
sonar.sources=cmd,internal,prompts

# Exclude non-production code. Our tools/, scripts/, benchmarks/, examples/,
# .claude/, and generated docs directories contain agent scripts, eval fixtures,
# migration tools, and build output — not shipped code. Scanning them inflated
# the issue count to 3,700+ code smells dominated by shell-script lint noise.
sonar.exclusions=\
    **/*_test.go,\
    **/testdata/**,\
    **/vendor/**,\
    tools/**,\
    scripts/**,\
    benchmarks/**,\
    examples/**,\
    .claude/**,\
    eval_results/**,\
    goldens/**,\
    gen/**,\
    __pycache__/**,\
    coverage/**,\
    **/*.sh

# Test file locations — used to bucket coverage separately from production code.
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go

# Coverage: Go cover profile. Produced by `make test-coverage` in
# `.github/workflows/ci.yml`; written to `coverage/coverage.out`.
sonar.go.coverage.reportPaths=coverage/coverage.out

# Duplication noise — SQL-string and struct-tag heavy files don't benefit.
sonar.cpd.exclusions=**/mocks/**,**/*_generated.go,internal/observatory/**

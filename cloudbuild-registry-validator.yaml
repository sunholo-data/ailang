# Registry validator — release-gated deploy (M-PKG-QUALITY-LADDER follow-up, 2026-09-17).
#
# Until 2026-09-17 the validator (registry.ailang.sunholo.com, the ONE Cloud Run
# service every `ailang publish` talks to) rebuilt and redeployed on EVERY push to
# ailang `dev` from an inline-config trigger (ailang-registry-validator-dev). The
# day the validator started enforcing gates, a dev push shipped a v2 identity that
# folded the upload's temp-dir path into the hash, and every publish fleet-wide was
# refused with PUB005 for ~40 minutes until the next dev push. Mark ratified the
# same rule the dashboard already has: the validator moves on release tags only.
#
# FINAL tags only, and only on green CI (m-v1-release-gates M3a,
# design_docs/planned/v1_0_0/m-v1-release-gates.md §2). A validator upgrade changes
# what every `ailang publish` accepts, fleet-wide, at once, and packages are
# checked only at publish — never re-validated. So:
#   release-guard  refuses any TAG_NAME that is not exactly vX.Y.Z (an rc, a
#                  manual-<sha> rebuild). The trigger's tag filter already skips
#                  pre-releases; this catches a manual `triggers run`.
#   ci-gate        tools/ci/require_checks.sh — the same script and the same list
#                  (tools/ci/release_required_checks.txt) as release.yml: EVERY
#                  check-run of every required name must be `success` on the
#                  tagged commit, and the annotated-tag `release-gate-override:`
#                  marker is honoured exactly as there (§1.3).
# The image may build while the gate polls; nothing is pushed or deployed until
# both pass. Planned (M3b): deploy a --no-traffic candidate here and move traffic
# in `promote core`, so the validator moves with core after the GitHub release.
#
# Trigger: ailang-registry-validator-release (terraform-triggers in ailang-multivac),
# push tag ^v[0-9]+\.[0-9]+\.[0-9]+$ on sunholo-data/ailang. Substitutions: _REGION,
# _TARGET_PROJECT. The image is tagged :${TAG_NAME} AND :latest.
#
# Rollback: `gcloud run services update ailang-registry-validator --image
# ...:vPREVIOUS` (or `update-traffic` to the previous revision). There is no
# ungated rebuild-from-a-commit path any more: a fix ships as a new final tag.

substitutions:
  _REGION: europe-west1
  _TARGET_PROJECT: ailang-registry

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# ci-gate may poll up to 90 min (require_checks.sh default: 360 x 15 s) while the
# image builds; the 3600 s default would kill a gate that is still legitimately
# waiting on build.yml's per-OS jobs.
timeout: 6600s

steps:
  # Refuse anything but a final release tag. Fails the build (rather than exiting
  # 0) because Cloud Build cannot skip the remaining steps from inside one step.
  - id: release-guard
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        TAG="${TAG_NAME}"
        if [[ "$$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$$ ]]; then
          echo "release-guard: $$TAG is a final release"
          exit 0
        fi
        echo "release-guard: '$$TAG' is not a final release tag (vX.Y.Z) — the registry validator is NOT deployed." >&2
        echo "  A release candidate never moves the one prod validator (m-v1-release-gates §2)." >&2
        exit 1
    waitFor: ['-']

  # git describe needs the tags so the binary's /version reports the release,
  # not "dev" — the skew guard prints this string to publishers. ci-gate also
  # reads the annotated tag object from here (override marker).
  - id: fetch-tags
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        git fetch --unshallow 2>&1 || git fetch --depth=1000 2>&1 || true
        git fetch --tags --force 2>&1 || true
        git describe --tags --always --dirty 2>&1 || true
    waitFor: ['-']

  # Same gate as release.yml, same script, same list. Fails closed: red, pending
  # past 90 min, a missing required name, an unreadable API, a tag that does not
  # point at COMMIT_SHA, or a tag that predates tools/ci/require_checks.sh.
  # The image has no gh: a two-line shim maps `gh api <path>` onto curl with the
  # deploy project's GitHub token (the secret cloudbuild-release.yaml uses).
  - id: ci-gate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv: ['GITHUB_TOKEN']
    args:
      - -c
      - |
        set -eu
        if ! command -v jq >/dev/null 2>&1; then
          apt-get update -qq >/dev/null && apt-get install -y -qq jq >/dev/null
        fi
        for t in jq git curl; do
          command -v "$$t" >/dev/null || { echo "ci-gate: $$t missing from the step image — refusing (fail closed)" >&2; exit 1; }
        done
        git config --global --add safe.directory /workspace
        mkdir -p /workspace/.ci-gate-bin
        printf '%s\n' '#!/bin/sh' \
          '[ "$$1" = api ] || { echo "gh shim: only gh api is supported" >&2; exit 2; }' \
          'exec curl -fsS -H "Authorization: Bearer $$GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/$$2"' \
          > /workspace/.ci-gate-bin/gh
        chmod +x /workspace/.ci-gate-bin/gh
        test -f tools/ci/require_checks.sh || { echo "ci-gate: ${TAG_NAME} has no tools/ci/require_checks.sh — refusing (fail closed)" >&2; exit 1; }
        PATH="/workspace/.ci-gate-bin:$$PATH" bash tools/ci/require_checks.sh \
          --tag "${TAG_NAME}" --repo sunholo-data/ailang "${COMMIT_SHA}"
    waitFor: [fetch-tags]

  - id: build-validator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/ailang-registry/validator:${TAG_NAME}
      - -t
      - ${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/ailang-registry/validator:latest
      - -f
      - docker/Dockerfile.registry-validator
      - .
    waitFor: [fetch-tags]

  # Nothing leaves the build until both gates pass: pushing :latest early would
  # move the tag other tooling resolves even when the deploy is refused.
  - id: push-validator
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/ailang-registry/validator"]
    waitFor: [build-validator, release-guard, ci-gate]

  - id: redeploy-validator
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        echo "Deploying registry validator ${TAG_NAME}..."
        gcloud run services update ailang-registry-validator \
          --region ${_REGION} --project ${_TARGET_PROJECT} \
          --image ${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/ailang-registry/validator:${TAG_NAME} \
          --quiet
        echo "Registry validator deployed at ${TAG_NAME}."
    waitFor: [push-validator]

# $PROJECT_ID is the build's own project (the deploy project the trigger runs in);
# the same secret cloudbuild-release.yaml's ci-gate reads.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-github-oauthtoken-f8f84f/versions/latest
      env: 'GITHUB_TOKEN'

images:
  - ${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/ailang-registry/validator:${TAG_NAME}
  - ${_REGION}-docker.pkg.dev/${_TARGET_PROJECT}/ailang-registry/validator:latest

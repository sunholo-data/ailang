  # =============================================================================
  # OpenRouter (https://openrouter.ai)
  # =============================================================================
  # OpenRouter is a unified gateway fronting ~100 LLMs from many vendors via an
  # OpenAI-compatible Chat Completions API. The provider field is "openrouter"
  # and the api_name uses OpenRouter's "vendor/model" convention.
  #
  # Pricing here is set to 0 because cost varies per resolved model and is
  # reported back by OpenRouter on each request (see ai.Response.CostUSD).

  # Legacy frontier or-* entries removed (v0.23.0): or-claude-sonnet-4-5,
  # or-gpt5, or-gpt5-mini, or-gemini-2-5-pro, or-gemini-2-5-flash.
  # Per the OpenRouter rule, frontier Google/Anthropic/OpenAI models must use
  # their native provider (anthropic/openai/google), not be routed through
  # OpenRouter. Use claude-sonnet-4-6, gpt5-5, gemini-3-1-pro, etc. instead.
  # OpenRouter is reserved for models with no native API (z-ai/GLM, MiniMax,
  # DeepSeek, Kimi, Qwen, Gemma).

  # or-llama-3-3-70b removed: Llama 3.3 70B is superseded by Llama 4 family
  # (which the SOTA-OS spread below also drops in favour of Qwen3/Gemma 4/
  # DeepSeek V4 per current open-source SOTA-by-size assessment).


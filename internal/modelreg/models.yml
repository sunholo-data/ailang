    max_output_tokens: 64000   # Standard eval mode calls the NON-streaming Messages API
      # (internal/ai/anthropic/client.go has no `stream` field); 64K matches every sibling
      # 4.5+ Anthropic entry. The model's streaming ceiling is 128K (OpenRouter reports
      # max_completion=128000 on all upstreams), but standard mode here never streams.
      # ⚠️ Thinking is ON BY DEFAULT on Opus 5 and max_tokens caps thinking + response text
      # TOGETHER — if benchmarks start banking truncated output (finish=length), raise this
      # before concluding a capability gap.
    pricing:
      input_per_1k: 0.005   # $5.00 per million (identical to Opus 4.8/4.7)
      output_per_1k: 0.025  # $25.00 per million (identical to Opus 4.8/4.7)
    notes: |
      Anthropic's Opus-tier flagship (July 2026). Drop-in at Opus 4.8 pricing
      ($5/$25 per 1M) with the same feature set: 1M context (default AND maximum),
      128K max output, adaptive thinking, prompt caching, batch, Files API, vision.
      Strongest on agentic coding, long-horizon work, and code review/bug-finding;
      the gap over 4.8 is largest on HARD multi-file tasks, smallest on easy single
      edits — gate it on the hard end of the tier ladder, not on smoke.
      API name uses no date suffix: "claude-opus-5".

      Harness-relevant API deltas vs Opus 4.8 (read before debugging a failure):
        • Thinking is ON BY DEFAULT — omitting the `thinking` field runs ADAPTIVE
          (on 4.8/4.7 omitting it meant no thinking). Our standard path omits it
          (internal/ai/anthropic/client.go emits no thinking key unless a reasoning
          effort is configured), so Opus 5 evals think by default. Expect higher
          output-token spend per benchmark than the 4.8 row at the same prices.
        • `thinking:{type:"disabled"}` is accepted only at effort <= high; pairing it
          with xhigh/max is a 400.
        • ⚠️ DO NOT set `reasoning_effort` / `thinking_budget_tokens` on this entry.
          internal/ai/reasoning.go maps those to `thinking:{type:"enabled",budget_tokens:N}`,
          which Anthropic REMOVED on Opus 4.7 and later — it returns 400, not a degraded
          run. (Latent for opus-4-7/4-8/fable-5/sonnet-5 too; no Claude entry sets it today.)
        • Separate rate-limit bucket — Opus 5 does NOT draw from the combined
          Opus 4.x pool, so shifting volume off 4.8 neither frees nor inherits headroom.
        • Prompt-cache minimum drops to 512 tokens (1024 on Opus 4.8).
        • Safety classifiers can return HTTP 200 with stop_reason "refusal" (elevated
          cyber safeguards). A refusal is NOT an api_error — bank it as such if seen.
      Fast mode (speed:"fast", $10/$50) is Claude-API-only and unused by this harness.

      Access verified 2026-07-27: listed on OpenRouter as anthropic/claude-opus-5
      (ctx 1M, max_completion 128K across Anthropic/Bedrock/Google/Azure upstreams),
      and `claude --model claude-opus-5 -p ...` returns cleanly via the Claude Code CLI.

      Gate status: PASSED 2026-07-27 — PROMOTED to benchmark_suite + extended_suite,
      replacing claude-opus-4-8. Measured on --tier core, --langs ailang, standard mode:
        N=1 (with claude-sonnet-4-6 anchor): opus-5 19/19 | opus-4-8 18/19 | sonnet-4-6 16/19
        N=3 de-flake (opus-5 vs opus-4-8):   opus-5 57/57 (100%) | opus-4-8 53/57 (93.0%)
      Opus 5 did not fail once in 76 core runs. 4.8's 5 failures hit 5 DIFFERENT benchmarks
      (config_file_parser, cli_args, csv_to_json_converter, json_transform, pipeline), never
      the same one twice — a reliability gap, not a single-capability gap, and precisely the
      thing N=1 could not separate from noise. Cost: $13.35 vs $13.59 per N=3 sweep (Opus 5
      marginally CHEAPER despite 1.9x output tokens — input tokens dominate at this size).
      The anchor earned its slot: sonnet-4-6's 3 misses were all passed by both Opus rows,
      and 4.8's N=1 miss was passed by the other two, so no benchmark was broken.

      NOTE on running standard-mode Claude evals here (corrects an earlier claim in this
      file): the ANTHROPIC_API_KEY strip is scoped to tools/launchd/mission-control.sh,
      which unsets it so the MISSION bills the Claude subscription rather than API credit.
      It is NOT a rig-wide block. ~/.config/ailang/secrets.env exports the key for other
      tools (os-rotation-filler.sh sources it the same way), and Secret Manager holds
      ailang-dev-anthropic-api-key. Standard-mode gating works: source secrets.env first.


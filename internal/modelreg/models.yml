  - "or-deepseek-v4-flash" # DeepSeek V4 Flash — 75% std, $0.10/1M (cheapest viable; re-gated 2026-06-04)
  - "or-deepseek-v4-pro"   # DeepSeek V4 Pro — REPOINTED 2026-08-13 to the 0813 GA slug
    # (core N=3 67/69 vs the preview's 65/69, and ~2.7x cheaper). Pre-2026-08-13 rows
    # under this name are the April preview — see the entry's baseline-boundary note.


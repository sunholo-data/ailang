  # ===== motoko_agent: AILANG-native agent harness =========================
  # The first production-scale coding agent built on AILANG itself (~5,200 LOC
  # of .ail modules + 9 motoko-ext-* extension packages). Routes models via
  # OpenRouter; emits schema-v1 session JSONL with per-step tokens + cost +
  # cache fields + terminal run_summary (M-MOTOKO-EVAL-INSTRUMENTATION,
  # motoko_agent commit 84fa449 on PR #6 against arniwesth/motoko_agent).
  #
  # Cross-harness comparison rationale (M-MOTOKO-EXECUTOR-ADAPTER):
  # paired against vanilla claude-haiku-4-5 / claude-sonnet-4-6, motoko-glm-5
  # routes via OpenRouter to test the cheap-OS-model + tuned-harness vs
  # frontier-model thesis. motoko-gemma-4 covers open-weight model coverage
  # (no first-party Gemma agent CLI exists; OpenRouter is the bridge).

  motoko-claude-haiku-4-5:
    api_name: "claude-haiku-4-5-20251001"

      Pricing: $0.75/$3.75 per 1M — a 50% INTRODUCTORY cut that reverts to $1.50/$7.50
      on 2027-01-01. Source: ai.google.dev/gemini-api/docs/pricing, quoted verbatim
      2026-08-13 (Google first-party, not a blog). NOTE: the same promo now also
      applies to gemini-3.6-flash on that page — see that entry's pricing block.

      ⚠️  REASONING MODEL — thinks by default. Probed 2026-08-13 with NO reasoning
      params on the same bare prompt used for the 3.6 Flash probe:
        3.7: thoughtsTokenCount=552, candidatesTokenCount=464  (54% of billed output)
        3.6: thoughtsTokenCount=693, candidatesTokenCount=452  (61% of billed output)
      Thinking bills at the OUTPUT rate, so cost projections must use

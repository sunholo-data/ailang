  # OPENCODE HARNESS MODELS
  # =============================================================================
  # These models are evaluated via the opencode CLI (npm install -g opencode-ai).
  # opencode supports ANY provider/model string including Ollama local models,
  # making it the gateway for open-source / local agent eval.
  # See: internal/executor/opencode/README.md

  opencode-haiku:
    api_name: "claude-haiku-4-5-20251001"
    provider: "anthropic"
    default_thinking: "off"
    description: "Claude Haiku 4.5 via opencode harness (multi-provider gateway)"
    env_var: "ANTHROPIC_API_KEY"
    agent_cli: "opencode"                        # Routes to opencode executor
    agent_model_name: "anthropic/claude-haiku-4-5"  # opencode provider/model format
    model_family: "claude-haiku-4-5"             # Cross-harness grouping: pairs with claude-haiku-4-5
    max_output_tokens: 64000  # M-EVAL-TOKEN-HEADROOM: was 16000; family ceiling (non-streaming Messages API)
    pricing:
      input_per_1k: 0.001    # $1.00 per 1M — CORRECTED 2026-08-13 (was 0.00025, Haiku 3.5 rates)
      output_per_1k: 0.005   # $5.00 per 1M — must match the canonical claude-haiku-4-5 row (same api_name)
    # M-EVAL-COST-AND-SPEED-BUDGETS (v0.15.1 retro): cheap-model agent budget.
    # Default formula = $0.056 — too tight. opencode harness compounds the
    # issue with internal Haiku compaction calls. Explicit $0.30.
    budgets:
      # WORK GATE (2026-07-31, Mark): one shared 3.0M blended-token ceiling across
      # agent_suite, so every model gets the same number of iterations. A dollar cap
      # cannot do this — it buys work in inverse proportion to price, which is how a
      # flat $0.30/$0.50 came to span 24x in actual tokens across this suite.
      max_tokens_per_bench: 3000000
      # $3.60 is the dollar equivalent of the 3.0M token gate at $1/$5 — raised from
      # $0.30 (which bought only 0.25M) so the TOKEN gate is the one that binds.
      # On this rig claude runs on OAuth, so this is not spend. ⚠️ Under
      # AILANG_AUTH_MODE=apikey (cloud dispatch) it IS metered — this is the
      # per-benchmark exposure ceiling in that configuration.
      max_cost_usd: 3.60
      hard_timeout_secs: 600
    notes: |
      Claude Haiku 4.5 evaluated via the opencode CLI harness.
      Used as the canonical opencode model in agent_suite — same model as claude-haiku-4-5
      but routed through opencode instead of Claude Code CLI.

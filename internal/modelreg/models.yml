  # Google Gemini 3.6 Flash (released July 21, 2026)
  # STATUS: access verified, smoke gate PASSED, PROMOTED to extended_suite 2026-07-21.
  # Not in benchmark_suite (gemini-3-1-pro holds the Google flagship slot), not in
  # dev_models (gemini-3-flash is the cheap dev model), not in agent_suite.
  #
  # Gate summary (standard mode, --langs ailang, N=1):
  #   tier      3-flash(incumbent)  3-5-flash   3-6-flash(candidate)
  #   smoke     -                   22/23       22/23
  #   core      19/19  ($0.47)      19/19       19/19  ($1.26)
  #   frontier   7/16  ($0.78)      12/16       9/16   ($2.71)
  #
  # Why not promoted: smoke AND core are SATURATED for the whole Flash family
  # (all three tie), so neither tier can rank them — only `--tier frontier`
  # separates them. Against the actual suite incumbent gemini-3-flash this is a
  # core tie at 2.7x the cost => "core tie at higher cost, keep the incumbent".
  #
  # vs gemini-3-5-flash — SETTLED AT N=3 (2026-07-21, 96 frontier runs):
  #   pass 1: 3.5=10/16  3.6=10/16
  #   pass 2: 3.5=10/16  3.6= 9/16
  #   pass 3: 3.5=12/16  3.6=10/16
  #   TOTAL:  3.5=32/48 (66.7%) $9.77   3.6=29/48 (60.4%) $6.77
  # Per-benchmark (of 3 attempts each): 6 benchmarks favour 3.5, 3 favour 3.6,
  # 7 tie. A sign test on the 9 that differ (6-3) is p~0.25 — NOT significant.
  # So 3.6 is nominally ~6pp weaker but NOT statistically distinguishable, while
  # being 31% CHEAPER and using 28% fewer thinking tokens (506k vs 703k).
  # No truncation on either model (finish=length: 0/96), so the 65536 ceiling
  # is adequate and is not confounding the comparison.
  #
  # ⚠️  RETRACTED: the earlier N=1 claim that 3.6 "lost contract_sorted_merge,
  # parse_prec_climb, ssa_constant_fold; won none" is WRONG. At N=3,
  # parse_prec_climb is 3/3 for BOTH, and 3.6 actually WINS ssa_constant_fold
  # (3/3 vs 2/3), quine (2/3 vs 1/3) and stream_lcg_topk (3/3 vs 2/3).
  # The real split is a genuine cost/quality trade, not a regression.
  #
  # NOTE: neither model has a `--tier stretch` measurement for 3.6, and stretch
  # is what release baselines actually run. Measure that before any swap of the
  # extended_suite Flash slot.
  gemini-3-6-flash:
    api_name: "gemini-3.6-flash"
    provider: "google"
    default_thinking: "on"  # extended_suite annotation: "28% fewer thinking tokens"
    description: "Gemini 3.6 Flash - successor to 3.5 Flash, same input price with 17% cheaper output"
    env_var: ""  # Eval harness uses Vertex AI ADC (gcloud auth application-default login).
    gcp_project: "ailang-dev"
    gcp_location: "global"
    # VERIFIED empirically 2026-07-21 against the Vertex global endpoint, not guessed:
    # 65536 ACCEPTED; 131072 REJECTED ("supported range is from 1 to 65535").
    max_output_tokens: 65536
    pricing:
      # ⚠️  REPRICED 2026-08-13 (was 0.0015 / 0.0075). When Gemini 3.7 Flash launched,
      # Google extended its 50% introductory cut ACROSS the Flash line, and the pricing
      # page now quotes 3.6 Flash at the same promo rate as 3.7. These constants EXPIRE
      # 2026-12-31 and revert to $1.50/$7.50 on 2027-01-01 — update them then or every
      # cost figure for this model is silently half the true spend.
      # Rows banked BEFORE 2026-08-13 are correct at the old $1.50/$7.50: the promo did
      # not exist on 2026-07-21 (the launch note below reasons from a $9.00 -> $7.50 cut,
      # which only holds at the pre-promo rate). Do NOT re-derive old costs at this rate.
      input_per_1k: 0.00075    # $0.75 per 1M through 2026-12-31 → $1.50 from 2027-01-01
      output_per_1k: 0.00375   # $3.75 per 1M through 2026-12-31 → $7.50 from 2027-01-01 (thinking billed as output)
      expires: "2026-12-31"    # last day the rates above are billed; enforced by TestModels_PricingScheduleIsHonoured
      next:
        input_per_1k: 0.0015   # $1.50 per 1M from 2027-01-01
        output_per_1k: 0.0075  # $7.50 per 1M from 2027-01-01
    notes: |
      Google's newest Flash model (released July 21, 2026), successor to Gemini 3.5 Flash.
      SUPERSEDED 2026-08-13 by gemini-3-7-flash (a refinement of this model, not a new
      pretraining run), which TOOK the extended_suite Flash-tier slot from this row after
      22 days. Pass rates were indistinguishable on smoke/core/stretch; the deciding
      margin was 42-48% more thinking tokens burned HERE at the same per-token price.
      This row stays opt-in (`--models gemini-3-6-flash`) as the longitudinal anchor —
      the same role gemini-3-5-flash was given when this row displaced it.
      1M token input context, 64K max output (65535 hard ceiling, verified via API rejection).
      Launch pricing was $1.50/$7.50 per 1M — input unchanged vs 3.5 Flash, output DOWN from
      $9.00 (-17%). As of 2026-08-13 it is on the same $0.75/$3.75 introductory rate as 3.7
      Flash (verbatim from the pricing page; see the pricing block above for the date boundary).
      Source: ai.google.dev/gemini-api/docs/pricing (Google first-party, not a blog).

      ⚠️  REASONING MODEL — thinks by default. Probed 2026-07-21 with NO reasoning
      params on a bare prompt: thoughtsTokenCount=739 vs candidatesTokenCount=600, i.e.
      55% of billed output was thinking. Per Google's pricing page, thinking tokens bill
      at the OUTPUT rate, so cost projections must use (output + thoughts), and expect
      roughly 2x the completion tokens of a non-thinking peer. Thinking is left ON —
      a thinking-tuned model with thinking suppressed is not the model we would be gating.
      max_output_tokens is set at the declared ceiling (65536) so a long thinking phase
      cannot silently guillotine the answer (the GLM-5.2 truncation lesson).

      Access verification (2026-07-21): POST to the Vertex global endpoint on project
      ailang-dev returned HTTP 200, modelVersion "gemini-3.6-flash", finishReason STOP.
      GA name — there is no gemini-3.6-flash-preview (that name 404s), unlike the 3.x
      preview-suffixed entries above.

      Standard mode (direct Vertex generateContent): ✅ ready.
      Agent mode: ❌ NOT wired. The 3.5 Flash agent path goes through Vertex Managed
      Agents under the public agent name "antigravity-preview-05-2026"; no equivalent
      agent name has been verified for 3.6, so no agent_cli is declared here rather than
      guessing one. Also note the 3.5 Flash agent-mode cost caveat above (caching is
      disabled whenever tools/system_instruction are present) applies to this family.

  # Google Gemini 3.5 Flash Lite (released July 21, 2026, alongside 3.6 Flash)
  # NOTE the version skew: the July 2026 pair is "Flash 3.6" + "Flash 3.5 LITE".
  # There is no gemini-3.6-flash-lite (404 on Vertex, probed 2026-07-21).
  # STATUS: access verified, IN extended_suite as the low-cost FLOOR ANCHOR
  # (added 2026-07-22, per Mark). See the extended_suite annotation for the role.
  #
  # Full baseline (standard mode, --langs ailang, N=1):
  #   tier      gemini-3-flash(cheap incumbent)   gemini-3-5-flash-lite
  #   smoke     -                                 21/23  ($0.21)
  #   core      19/19  ($0.47)                    14/19  ($0.20)
  #   stretch   20/21                             9/21   ($0.22)
  #   frontier   7/16  ($0.78)                    1/16   ($0.19)
  #
  # It is ~2.3x cheaper than gemini-3-flash and burns ZERO thinking tokens (0
  # across all 79 gate runs), but COLLAPSES as difficulty rises — 14/19 core,
  # 9/21 stretch, 1/16 frontier, dominant failure mode compile_error (it stops
  # writing valid AILANG). It does NOT displace gemini-3-flash, which stays as
  # the capable cheap model; flash-lite is a rung BELOW it.
  #
  # It is in the suite as a LANGUAGE-IMPROVEMENT TRACKER, not for capability:
  # its huge headroom + zero thinking-noise + trivial cost make it the most
  # sensitive gauge of whether stdlib/prompt work makes AILANG easier for weak
  # models. The numbers above are the 2026-07-22 baseline to lift.
  gemini-3-5-flash-lite:
    api_name: "gemini-3.5-flash-lite"
    provider: "google"
    default_thinking: "none"
    description: "Gemini 3.5 Flash Lite - cheapest current-gen Gemini; NO default thinking overhead"
    env_var: ""  # Eval harness uses Vertex AI ADC (gcloud auth application-default login).
    gcp_project: "ailang-dev"
    gcp_location: "global"
    # VERIFIED empirically 2026-07-21: 65536 ACCEPTED, 131072 REJECTED.
    max_output_tokens: 65536
    pricing:
      input_per_1k: 0.0003     # $0.30 per 1M = $0.0003 per 1K
      output_per_1k: 0.0025    # $2.50 per 1M = $0.0025 per 1K
    notes: |
      Cheapest current-generation Gemini (released July 21, 2026).
      $0.30/$2.50 per 1M — 5x cheaper input / 3x cheaper output than 3.6 Flash,
      and cheaper than the suite incumbent gemini-3-flash ($0.50/$3.00).
      Source: ai.google.dev/gemini-api/docs/pricing (Google first-party).

      ✅ DOES NOT THINK BY DEFAULT — this is the headline property. Probed
      2026-07-21 with no reasoning params on the same prompt used for 3.6 Flash:
      usageMetadata contained NO thoughtsTokenCount field at all (vs 739 thinking
      tokens for 3.6 Flash on the identical prompt). This matters because thinking
      bills at the OUTPUT rate, and thinking cost is exactly why the 3.5 Flash
      generation was never promoted into the suites: on --tier frontier,
      gemini-3-5-flash burned 215,540 thinking tokens vs 156,446 for the cheaper
      gemini-3-flash incumbent. A no-thinking Lite sidesteps that failure mode.

      Access verification (2026-07-21): Vertex global endpoint, project ailang-dev,
      HTTP 200, modelVersion "gemini-3.5-flash-lite". GA name — the -preview
      suffixed form 404s.

      Standard mode: ✅ ready. Agent mode: ❌ not wired (no agent_cli declared;
      no agent name verified for this model rather than guessing one).


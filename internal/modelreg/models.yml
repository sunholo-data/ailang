  # pi-harness sibling of opencode-or-deepseek-v4-flash — added 2026-08-06 as the
  # MISSION-FLEET TRIAL lane (codex quota offload candidate, per Mark). Opt-in
  # only; smoke gate CLEARED (see notes) — suite promotion still pending a
  # core-tier ranking run + Mark's decision (smoke is a floor, not a ranking).
  pi-or-deepseek-v4-flash:
    api_name: "deepseek/deepseek-v4-flash-0731"
    provider: "openrouter"
    default_thinking: "on"  # probed 2026-08-06: 75 reasoning tokens unprompted
                            # (via Venice host) — the 0731 checkpoint THINKS by
                            # default, unlike the April preview (probed non-thinking
                            # 2026-07-19). Light thinker; single-host probe, N=1.
    description: "DeepSeek V4 Flash 0731 via pi minimal harness — mission-fleet trial (codex offload candidate)"
    env_var: "OPENROUTER_API_KEY"
    agent_cli: "pi"
    # PRICE-PINNED 2026-08-11. Bare ids let OpenRouter load-balance across 26
    # hosts; prompt caches are PER-PROVIDER, so consecutive calls landed on
    # different hosts and cached nothing. Measured: unpinned cacheRead=0 on two
    # identical ~27.7k-token prompts; :floor (provider.sort=price) cached 27,392
    # of 27,673 on the second call — 4.8x cheaper per repeat call. :floor is a
    # price SORT, not a hard pin: if the cheapest host changes, routing moves and
    # the cache resets. A hard pin needs provider.only, which pi cannot express.
    agent_model_name: "openrouter/deepseek/deepseek-v4-flash-0731:floor"
    model_family: "deepseek-v4"
    max_output_tokens: 32000  # PI_WIRE_CLAMP (was 65536)  # matches or-/opencode- siblings. Declared ceilings
                              # (endpoints API 2026-08-06): first-party DeepSeek
                              # 384K, most hosts >=131K, min-host Venice 32768 —
                              # routing roulette can undercut this cap on Venice.
                              # ⚠️ THIS NUMBER DOES NOT REACH THE WIRE BY ITSELF.
                              # pi has no max-tokens flag: it reads maxTokens from
                              # ~/.pi/agent/models.json (canonical copy:
                              # tools/pi-extensions/models.mission.json) and
                              # defaults to 16384 for a model that omits it. This
                              # entry declared 65536 while every pi run — mission
                              # executor AND agent-mode eval — was capped at
                              # 16384 with thinking billed against it, until
                              # 2026-08-13. TestPiModelsConfigMatchesRegistry now
                              # fails if the two drift apart again.
                              # ✅ ROOT-CAUSED 2026-08-26. THE CEILING IS pi's, AND IT IS 32000.
                              # `buildBaseOptions` in pi-ai
                              # (dist/providers/simple-options.js:4) computes
                              #   maxTokens: options?.maxTokens
                              #              ?? (model.maxTokens > 0
                              #                  ? Math.min(model.maxTokens, 32000)
                              #                  : undefined)
                              # and pi-coding-agent passes NO options.maxTokens for main
                              # agent turns (only compaction and branch-summarisation do).
                              # So every pi lane is clamped to 32000 no matter what any
                              # config declares. EVERY provider goes through this function.
                              # PROVEN ON THE WIRE, not inferred: declaring 20000 produced
                              # max_completion_tokens=20000, declaring 65536 produced 32000
                              # — i.e. the rule is exactly min(declared, 32000).
                              # There is no escape hatch: pi has no max-tokens CLI flag and
                              # its extension API exposes no request-options hook.
                              # So this entry now declares the TRUTH. Do not "restore" 65536:
                              # it was never reachable, and CI pinning it made the harness
                              # believe a budget the wire never carried.
                              # NOT currently binding: zero finish_reason=length across the
                              # whole OpenRouter Broadcast corpus, and the most any pi lane
                              # has ever emitted is 11,602 output tokens.
                              # Verify with: scripts/check_pi_wire_budget.sh
    pricing:
      # RE-MEASURED 2026-08-11 from OpenRouter's own endpoints API. The model is
      # served by 26 upstream hosts at $0.08-0.14/M input, so a single number is
      # always approximate; these track DeepInfra, which is what the :floor
      # (sort=price) variant selects and therefore what this lane actually bills.
      # The old $0.09 was the mid-band, not any host we necessarily hit.
      input_per_1k: 0.000065   # $0.065 per 1M (OpenRouter API, verified 2026-08-31)
      output_per_1k: 0.00018   # $0.18 per 1M (OpenRouter API, verified 2026-08-31)
      cache_read_per_1k: 0.000016  # $0.016 per 1M — ~20% of input, the standard
                                   # OpenRouter cache-read discount. Before this
                                   # field existed, cache reads were billed at $0
                                   # (the documented ~25-30% undercount).
    budgets:
      max_cost_usd: 0.50      # same rationale as opencode twin: cost-gated, not time-gated
      hard_timeout_secs: 3600
    notes: |
      Requires the deepseek/deepseek-v4-flash-0731 id in the ~/.pi/agent/models.json
      openrouter provider block (pi custom provider, openai-completions API — same
      mechanism as the local ollama block; added 2026-08-06).
      Trial motivation: opencode twin ranked #2 agent-mode ELO overall on the
      v0.32.0 baseline (2513, behind only claude-sonnet-4-6's 3078) at ~1/100th
      Sonnet price; pi is the minimal-harness cross-check before wiring a
      mission-fleet executor lane.
      GATE RECORD 2026-08-06: agent smoke 23/23 CLEAN PASS (full derived
      tier:smoke set), $0.128 metered total (~$0.16-0.17 true incl. the
      documented cache-read undercount), median 18s/benchmark, max 255s.
      First run of this lane; N=1. The April-preview checkpoint was a 2/3
      agent near-miss via opencode — the 0731 checkpoint is a different
      animal. Floor cleared; ranking (core tier) + mission Go-task replay
      trial still open.


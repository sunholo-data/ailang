# =============================================================================
# MODEL SUITES
# =============================================================================
# Models defined in `models:` above are AVAILABLE but not automatically run.
# Only models listed in a suite below are included when that suite is invoked.
# This allows defining many models while controlling evaluation costs.
#
# Usage:
#   ailang eval-suite                    # Uses dev_models (cheap, fast)
#   ailang eval-suite --suite benchmark  # Uses benchmark_suite (core 3)
#   ailang eval-suite --full             # Uses extended_suite (top 6)
#   ailang eval-suite --models gpt5-2    # Run specific model(s)
# =============================================================================

# Core benchmark suite - top model from each provider (3 models)
# Use for: Regular CI, quick comparisons, development validation
# ─────────────────────────────────────────────────────────────────────────────
# roles: which model plays which role (M-MODEL-REGISTRY-SINGLE-SOURCE M3)
#
# models.yml has always held model FACTS. This is model POLICY, and it
# SUPERSEDES the `model_routing` table in ailang-multivac/config/config.cloud.yaml
# (M-PIPELINE-RECONCILIATION M5), which answered the same question in a second
# place that needed a separate deploy.
#
# Entries are FRIENDLY NAMES (keys in `models:` above), never wire strings.
# That is what makes the table unambiguous: the live model_routing chains are
# raw per-harness strings and map back many-to-one — "openrouter/deepseek/
# deepseek-v4-flash-0731" is BOTH motoko-or-deepseek-v4-flash and
# opencode-or-deepseek-v4-flash. A friendly name picks the row; the row carries
# the harness (agent_cli) and the exact wire string.
#
# TRANSCRIBED VERBATIM from config.cloud.yaml:61-64 as measured 2026-08-27.
# Changing which models a role runs is an explicit Non-Goal of this sprint;
# TestResolveRole_TranscribesLiveChainsByteIdentically pins the wire strings.
#
# One judgement call, recorded so it can be revisited: for the deepseek and
# minimax links the opencode twin was chosen over the motoko twin. Both resolve
# to a BYTE-IDENTICAL wire string, so the transcription is faithful either way;
# opencode was picked for consistency with the designer link, which is
# unambiguously opencode. The choice only becomes observable in M7, where the
# coordinator starts consuming RoleEntry.Executor.
#
# NOT transcribed: the design doc sketched a `package:` role and a `fable-5`
# designer fallback. Neither exists in the live table and no agent carries a
# `package` role, so adding them here would be inventing policy under a
# Non-Goal. Add them when something actually asks for them.
# TRANSCRIBED from config.cloud.yaml's model_routing as it stood 2026-08-27,
# before M7 deleted that table. Changing WHICH models a role runs is an explicit
# Non-Goal of M-MODEL-REGISTRY-SINGLE-SOURCE; these chains say exactly what the
# table said, and TestCloudAgents_RegistryMatchesTheDeletedRoutingTable pins that.
#
# A SUBSCRIPTION-FIRST ORDER WAS DRAFTED AND REVERTED (2026-08-27). Mark's design
# is that one chain serves both lanes, leading with the subscription/OAuth model
# and falling through to the metered API-key lane when OAuth is spent — the shape
# the mission driver already uses for its controller. It was reverted with M8,
# not rejected: adopting it here would have shipped a fleet policy change as a
# side effect of a parked milestone, and the draft was a poor model of what the
# driver actually does (two-deep chains on `pi`, an ollama-cloud flat-rate tier
# first, and a mission-form string that is NOT agent_cli:agent_model_name).
# It belongs in the follow-up design doc that models those properly.
#
# Entries beyond the first are DECLARATIVE. coordinator.ResolveModel takes
# chain[0] and stops; the mission driver probes-and-falls-back for its CONTROLLER
# only. Said plainly because the table this replaced carried a comment claiming
# Lane A read it, which a grep showed was never true.
roles:
  designer:  [opencode-or-kimi-k3]
  planner:   [gpt5-6-sol, opencode-or-kimi-k3]
  executor:  [gpt5-6-sol, opencode-or-deepseek-v4-flash]
  evaluator: [opencode-or-minimax-m3, opencode-or-deepseek-v4-flash]

benchmark_suite:
  - "gpt5-6-sol"       # OpenAI flagship (Jul 2026) — replaced gpt5-5 (core tie 25/26 at identical $5/$30, newer gen)
  - "claude-opus-5"    # Anthropic flagship (Jul 2026) — REPLACED claude-opus-4-8 2026-07-27.
    # Gate: core N=1 19/19 vs 4.8's 18/19, then N=3 57/57 (100%) vs 53/57 (93.0%). Opus 5 did
    # not fail once in 76 core runs; 4.8 failed 5 times across 5 DIFFERENT benchmarks
    # (config_file_parser, cli_args, csv_to_json_converter, json_transform, pipeline) — a
    # reliability gap, not a single-capability gap. Cost is a wash: $13.35 vs $13.59 per N=3
    # sweep, i.e. Opus 5 is marginally CHEAPER despite 1.9x the output tokens, because input
    # tokens (~816K, identical) dominate at core-tier prompt sizes.
  - "gemini-3-1-pro"   # Google flagship (Feb 2026)
  - "or-glm-5-3"       # z.ai flagship (Aug 2026, 753B) — added 2026-08-31 (Mark): smoke PASSED
    # 23/23 first pass (zero finish=length at 65536, whole tier $1.38). Lineage core
    # gate vs or-glm-5-2 PENDING (2026-09-01 post-budget-reset; per the row notes,
    # this seat does NOT contest 5.3-flash's extended_suite slot). If the flagship
    # loses to 5.2 on core, revisit this membership.

# Extended suite - flagship frontier + modern open-source (16 models)
# Use for: Release baselines, comprehensive comparisons, cloud-vs-OS cost/quality.
# Cost: ~$3-6 per full benchmark run (+~$16 for fable on core,stretch)
# Standard mode only — cloud models never run the smoke tier (smoke is the local
# OS-model iteration loop); release baselines run core,stretch.
# OS roster: glm-5.3-flash (replaced 5.2 2026-08-27; 5.2 replaced 5.1 2026-07-19),
# kimi k3, deepseek-v4 flash/pro. Roster last changed 2026-08-31 (Mark):
# or-minimax-m3 + or-kimi-k2-7-code retired to opt-in; or-qwen3-8-flash is the
# designated replacement but its smoke gate is still PENDING (attempt 1
# 2026-08-31 invalidated by upstream Alibaba 429s — see its row), so it enters
# only when the gate passes (scheduled with the 2026-09-01 budget reset);
# before that 2026-08-27, or-glm-5-3-flash in, or-glm-5-2 out — core tie at
# ~1/13 cost. See the per-entry annotations below for each gate record.
extended_suite:
  - "gpt5-6-sol"        # OpenAI flagship (Jul 2026) — gated 2026-07-11: core 26/26 N=1, tie 25/26 with gpt5-5
    # after N=3 de-flake of explicit_dataflow_ssa (both fail it 3/3; every OpenAI model fails it).
    # ^ STALE as of 2026-08-27: sol passed explicit_dataflow_ssa 1/3 and terra 2/3 in a clean N=3
    #   (zero api_error) paired run — the benchmark is now flaky-passable for OpenAI models, not a
    #   stable fail. Same run: sol 17/27 vs terra 16/27 on the 9-cell discriminating set, sign test
    #   p=1.000 — INDISTINGUISHABLE in aggregate at 2.4x the cost, but with stable complementary
    #   specializations (terra 3/3 vs sol 1/3 on contract_sorted_merge + legal_obligation_engine;
    #   sol 3/3 vs terra 0/3 on ssa_constant_fold, and sol alone cracked gauntlet_10 + quine 1/3).
    #   Sol's baseline-apparent deficit was partly two OpenAI-520 harness kills, correctly
    #   quarantined by the validity filter (n=35 vs 37 in eval-elo was that filter working).
    # Identical $5/$30 pricing → same-cost generational refresh, gpt5-5 kept opt-in for longitudinal compare.
  - "gpt5-6-terra"      # OpenAI mid tier (Jul 2026) — added 2026-07-11 for new-release tracking (per Mark).
    # Gate: core 24/26 at $1.82 — ties sonnet-4-6 anchor at ~70% of its cost. No incumbent displaced.
  - "gpt5-6-luna"       # OpenAI fast tier (Jul 2026) — added 2026-07-11 for new-release tracking (per Mark).
    # Gate: core 23/26 at $0.73, LOST to gpt5-4-mini (25/26, $0.55) — in suite for longitudinal
    # visibility only; dev_models/lang_harness_suite keep mini. Revisit both at next OpenAI gen.
  - "gpt5-4-mini"       # OpenAI cheap (Mar 2026)
  - "claude-fable-5"    # Anthropic most-capable (Jun 2026, Mythos-class, $10/$50 per 1M) — standard eval only, NEVER agent_suite
  - "claude-opus-5"     # Anthropic flagship (Jul 2026) — REPLACED claude-opus-4-8 2026-07-27 on a
    # core N=3 sweep: 57/57 (100%) vs 4.8's 53/57 (93.0%), at $13.35 vs $13.59. See the
    # benchmark_suite annotation for the full gate record. 4.8 retired to opt-in.
    # ⚠️ Opus 5 runs ADAPTIVE THINKING BY DEFAULT (omitting the thinking field enables it,
    # unlike 4.8 where omission meant none), so this row's output-token count is ~1.9x the
    # 4.8 row it replaced. That is the model's own default, not a harness setting — see
    # [Unreleased] "Anthropic thinking control is now model-generation aware".
  - "claude-sonnet-5"   # Anthropic best for coding (Jun 2026) — gated 2026-06-30: core 24/26 (92.3%) vs
    # sonnet-4-6's 23/26 (88.5%), ~35% higher cost/bench (new tokenizer + adaptive thinking default).
    # Narrow N=1 win — kept sonnet-4-6 alongside as the longitudinal anchor, not a replacement.
  - "claude-sonnet-4-6" # Anthropic previous-gen, kept as longitudinal anchor (Feb 2026)
  - "gemini-3-1-pro"    # Google flagship (Feb 2026)
  - "gemini-3-7-flash"  # Google newest Flash (Aug 2026) — REPLACED gemini-3-6-flash 2026-08-13
    # (per Mark), three weeks after 3.6 took the same slot from 3.5. Matched head-to-head, same
    # command, same day, thinking-inclusive, N=1 unless noted:
    #   smoke 23/23 = 23/23 | core 23/23 = 23/23 | stretch 24/25 = 24/25
    # TIED on every tier, and on core both models are pinned at CEILING (23/23), so that tier
    # carries no ranking signal here at all — do not cite it as evidence either way.
    #
    # The two stretch benchmarks they split on were de-flaked at N=3, and BOTH turned out to be
    # flaky for BOTH models rather than a capability difference:
    #   emit_exact_bytes_varied  3.6 1/3  vs  3.7 2/3
    #   run_length_encode        3.6 1/3  vs  3.7 0/3
    #   discordant total         3.6 2/6  vs  3.7 2/6   — dead even
    # ⚠️  RETRACTED before it could calcify: the N=1 reading that 3.7 "fixes emit_exact_bytes_varied,
    # the standing failure of the Flash line (3.5 and 3.6 both fail it)" is WRONG. 3.6 passes it
    # 1/3. The benchmark is unstable, not diagnostic. There is NO measured capability gain here.
    #
    # What the swap IS justified by — the same grounds that carried 3.5 -> 3.6, only stronger:
    #   · newer generation, tracked on release (same rationale as gpt5-6-luna above)
    #   · IDENTICAL price ($0.75/$3.75 per 1M — 3.7's launch promo was extended to 3.6, so unlike
    #     the last swap there is no rate difference to trade off at all)
    #   · 42-48% FEWER THINKING TOKENS: core 34,405 vs 59,250 | stretch 71,468 vs 137,376
    #   · which at equal rates makes it 12% (core) to 19% (stretch) cheaper: $0.925 vs $1.147 on
    #     stretch, the tier release baselines actually run. Unlike the 3.5 -> 3.6 swap — which was
    #     cost-NEUTRAL on stretch (within 3%) and honest about it — this one is a real saving.
    # No truncation on either model (finish=length: 0/50 on stretch), so the 65536 ceiling is
    # adequate and is not confounding the thinking-token comparison.
    #
    # NOT measured, and the honest gap in this record: --tier frontier. The 3.5 -> 3.6 swap had a
    # frontier N=3 pass; this one does not. If frontier becomes a routine baseline tier, measure it
    # before trusting this row there.
    # NOTE: gemini-3-6-flash remains opt-in via `--models gemini-3-6-flash` as the longitudinal
    # comparison point, exactly as gemini-3-5-flash was kept when 3.6 displaced it.
  - "gemini-3-flash"    # Google fast + cheap (Dec 2025)
  - "gemini-3-5-flash-lite"  # Google cheapest current-gen (Jul 2026), $0.30/$2.50, ZERO thinking tokens.
    # Added 2026-07-22 (per Mark) as the LOW-COST FLOOR ANCHOR + language-improvement tracker, NOT as
    # a capable model. Full baseline: smoke 21/23 | core 14/19 | stretch 9/21 | frontier 1/16.
    # Full core+stretch run costs ~$0.42 (cheapest cloud row in the suite by far).
    # ⚠️  This model INTENTIONALLY LOWERS the extended_suite aggregate pass rate — it fails ~26% of

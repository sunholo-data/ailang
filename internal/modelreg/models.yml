    default_thinking: "off"
    description: "Claude Haiku 4.5 via motoko_agent (AILANG-native harness with DP7 verifier + microRAG context + extensions)"
    env_var: "OPENROUTER_API_KEY"
    agent_cli: "motoko"
    motoko_profile: "cloud"                            # .motoko/config/cloud — compaction_ai+context_mode+ailang_docs+microrag, DP7 gate = `ailang check`
    agent_model_name: "openrouter/anthropic/claude-haiku-4-5"
    model_family: "claude-haiku-4-5"                 # Pairs with claude-haiku-4-5 + opencode-haiku + pi-claude-haiku-4-5
    max_output_tokens: 64000  # M-EVAL-TOKEN-HEADROOM: was 16000; family ceiling (non-streaming Messages API)
    pricing:
      input_per_1k: 0.001    # $1.00 per 1M — CORRECTED 2026-08-13 (was 0.00025, Haiku 3.5 rates)
      output_per_1k: 0.005   # $5.00 per 1M — must match the canonical claude-haiku-4-5 row (same api_name)
    notes: |
      Claude Haiku 4.5 evaluated via the motoko_agent harness — the FIRST
      AILANG-native agent in the eval suite. Routes via OpenRouter so this
      entry uses OPENROUTER_API_KEY (NOT ANTHROPIC_API_KEY) — matches the

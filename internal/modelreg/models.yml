  # The exclusion above is AGENT-MODE ONLY: not in agent_suite, and not run
  # through the managed_agents path in any suite.
  # Re-evaluate when Google ships either (a) a tools-compatible cache mode,
  # (b) static-prefix caching for system_instruction + tool definitions, or
  # (c) cachedContentTokenCount exposed in /interactions usage payloads.
  #
  # STANDARD mode (direct Vertex generateContent) is UNAFFECTED by all of the
  # above. Opt-in only as of 2026-07-21: gemini-3-6-flash took the extended_suite
  # Flash slot on a tier-parity + recency basis (see that annotation). 3.5 is
  # retained as the longitudinal comparison point and is the stronger model on
  # frontier by an unproven ~6pp (32/48 vs 29/48 at N=3, p~0.25).
  # ⚠️  2026-07-21 correction: this block previously read "NOT added to
  # agent_suite / benchmark_suite / extended_suite / dev_models" while ALSO
  # claiming standard mode "remains in the standard baseline". Those two
  # statements contradicted each other, and the first one won in practice —
  # the model had drifted out of every suite, so an agent-mode cost problem

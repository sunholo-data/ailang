# AILANG Evaluation Model Configuration
# Last updated: July 2026
#
# This file defines the canonical model names for evaluation benchmarks.
# Update this file when new model versions are released.
#
# =============================================================================
# TWO FIELD POLICIES (M-EVAL-TOKEN-HEADROOM, 2026-07-27) — read before editing
# design_docs/planned/v0_31_0/m-eval-token-headroom.md
# =============================================================================
#
# `default_thinking` — REQUIRED on every entry. Enforced by
# TestModels_DefaultThinkingIsExplicit.
#
#   The harness sends NO `thinking` control, so every model runs at its VENDOR
#   default — and those disagree: Opus 5 / Sonnet 5 think, Opus 4.8 does not,
#   Fable 5 cannot be stopped, gemini-3-5-flash-lite has no thinking at all.
#   Without this column you cannot tell whether a row's output tokens are answer
#   or reasoning — which is exactly how GLM-5.2's truncated thinking was misread
#   as a capability regression for a month in June 2026.
#
#     "on"        thinks when sent no thinking control
#     "off"       does not think unless explicitly asked
#     "always_on" cannot be disabled (an explicit disable is an API error)
#     "none"      no thinking capability at all
#     "unknown"   NOT YET VERIFIED — do NOT read this row's token counts as
#                 efficiency data. This value is deliberate and permitted: a
#                 guess corrupts a comparison silently, an admission does not.
#                 Upgrade a row only with a citable source, in the comment.
#
# `max_output_tokens` — CLOUD entries sit at the 65536 target, or at a lower
# DOCUMENTED provider ceiling. Enforced by TestModels_CloudHeadroomEqualised.
#
#   Unequal headroom is a silent, DIRECTIONAL confound: a thinking model on a
#   small budget looks like a weak model. Before this policy the suite ranged
#   from 8192 to 128000. Equalising is also what converts "ran out of tokens"
#   from a harness artifact into real token-efficiency signal about the model —
#   which is why it pairs with banking `finish_reason` (a truncated run reports
#   finish_reason "length").
#
#   Ceiling-limited exceptions are listed in the test, each with its source.
#   Local (ollama) rows are EXEMPT — their cap is VRAM-bound, not policy.
#
#   ⚠️ Post-2026-07-27 numbers are NOT comparable to earlier baselines: rows
#   moved by up to 8x. Pre-v0.30.0 results also lack reason_tokens entirely and
#   cannot be re-judged for truncation — only re-run.
#
# =============================================================================
# PRICING IS A DRIFTING MEASUREMENT (M-EVAL-PRICING-DRIFT, 2026-08-13)
# =============================================================================
#
# `pricing:` is the ONE source of truth for a row's rate. Prose in `notes:` is
# DATED NARRATIVE — it records what a price was when someone wrote it, and MUST
# NOT be read as the current rate. Do not "fix" that prose to match a new price;
# it is history ("dropped $0.14/$0.28 -> $0.09/$0.18"), and rewriting it destroys
# the record of when a vendor moved.
#
# `description:` is the opposite: a current-tense label surfaced by
# `ailang eval-models`, with nowhere to hang a verified-on date. Do NOT embed a
# rate in one — it will silently rot. Say "cheapest viable model", not
# "cheapest viable model ($0.09/$0.18 per 1M)".
#
# Vendors reprice with no notice and no changelog. The 2026-08-13 audit found
# 23 of 39 `provider: "openrouter"` rows stale, drift running from 0.89x to
# 3.67x and in BOTH directions — understated cost silently flatters a model in
# every cost-per-pass comparison, overstated cost silently penalises it. The
# trigger case, `or-deepseek-v4-pro`, had been holding the price of what is now
# a DIFFERENT slug (`deepseek/deepseek-v4-pro-0813`) for a 2.7x understatement.
#
# Hand-verification decays faster than anyone expects: `or-glm-5-2` carried
# "verified live 2026-08-06 via /api/v1/models" in its notes and its output rate
# was already 1.79x stale seven days later. A verified-on date is evidence of
# when someone looked, NOT evidence that the number is still right.
#
#   make verify-model-pricing    # diffs every openrouter row against the live
#                                # OpenRouter API; exits non-zero on drift.
#                                # NOT in `make ci` — it needs the network and a
#                                # third party's uptime. Run it before trusting
#                                # any cost figure, and after any repricing news.
#
# The offline half of the gate DOES run in CI: TestModels_OpenRouterPricingIsSlugConsistent
# (models_pricing_consistency_test.go) requires that two rows sharing an
# `api_name` also share a price — the same model cannot cost two different
# amounts depending on which harness invokes it.
#
# ⚠️ Banked results are NEVER recomputed when a price is corrected here. A
# banked cost is a measurement of what a run cost under the rates in force at
# the time; recomputing it with today's rate would fabricate a number no one was
# ever charged. Correct the rate going forward and ANNOTATE the affected
# baseline — precedent: v0.30.0 cost invalidation, and
# design_docs/implemented/v0_31_0/m-eval-measurement-contract.md ("the existing
# data stays as-is, only annotated").
# =============================================================================

# Model definitions
models:
  # OpenAI GPT-5 (released August 2025)
  gpt5:
    api_name: "gpt-5"
    provider: "openai"
    default_thinking: "unknown"  # NOT VERIFIED — do not read this row's token counts as efficiency data
    description: "GPT-5 full reasoning model"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 65536  # M-EVAL-TOKEN-HEADROOM: was 128000
    pricing:
      input_per_1k: 0.00125   # $1.25 per 1M = $0.00125 per 1K
      output_per_1k: 0.01      # $10 per 1M = $0.01 per 1K
    notes: |
      Main GPT-5 model with reasoning capabilities.
      90% discount on cached tokens ($0.125/M).
      Use for production benchmarks.
      Agent eval support: Not yet implemented (requires OpenAI Codex CLI).


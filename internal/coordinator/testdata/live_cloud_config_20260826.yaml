        - "PR_URL:"
        - "DECISION:"
      artifact_patterns:
        - "packages/test-pkg-consumer/**/*"
      git_mode: guardrails

    # ═══════════════════════════════════════════════════════════
    # M-COORDINATOR-INBOX-WILDCARDS: family routing
    #
    # A trailing `*` matches by longest prefix, and an exact `inbox:` entry
    # above always wins over a pattern. One entry serves the whole
    # motoko_ext_* family (16 packages today) so a NEW extension is routed
    # the moment it is published, with no config change.
    #
    # This closes the gap that made an abi 2.1.0 republish fail 10 dependent
    # cascades in silence: with no agent registered for the inbox, each task
    # was created with an empty AgentID, dispatched to a Cloud Run Job, and
    # died on arrival with "AILANG_AGENT_ID environment variable is required".
    #
    # No `subdirectory` here — it differs per package, and the prompt names
    # the package so the agent can locate packages/<name> itself. Note the
    # registry spells packages with underscores and the directories use
    # hyphens (motoko_ext_abi -> packages/motoko-ext-abi).
    # ═══════════════════════════════════════════════════════════

    - id: pkg-motoko-ext-family
      label: "Package family: sunholo/motoko_ext_*"
      inbox: "pkg:sunholo/motoko_ext_*"
      workspace: sunholo-data/ailang-packages
      merge_branch: main
      capabilities: [code, test, docs]
      provider: claude
      model: sonnet
      timeout: "20m"
      idle_timeout: "3m"
      auto_approve_handoffs: false
      auto_merge: false
      skip_approval: false
      session_continuity: true
      max_concurrent_tasks: 1
      invoke:
        type: prompt
        template_file: /etc/ailang-config/templates/pkg-update.md
        template_by_message_type:
          feedback: /etc/ailang-config/templates/pkg-feedback.md
      output_markers:
        - "FEEDBACK_ACTION:"
        - "PUBLISH_RESULT:"
        - "VERSION:"
      artifact_patterns:
        - "packages/motoko-ext-*/**/*"
      git_mode: guardrails

    # Published packages that are not part of a family and had no agent,
    # so their feedback and cascades went to an inbox nothing watched.

    - id: pkg-sunholo-deontic
      label: "Package: sunholo/deontic"

    # Test target for the package-feedback loop. Safe to send synthetic
    # submit_feedback traffic at pkg:sunholo/test_pkg — agent will triage,
    # open issues / open docs PRs, and stop. Never auto-merges; never
    # publishes a release. Used by scripts/integration/test_pkg_feedback_loop.sh.
    - id: pkg-sunholo-test-pkg
      label: "Package: sunholo/test_pkg (integration test target)"
      inbox: "pkg:sunholo/test_pkg"
      workspace: sunholo-data/ailang-packages
      merge_branch: main
      subdirectory: packages/test-pkg
      capabilities: [code, test, docs]
      provider: claude
      model: haiku
      timeout: "15m"
      idle_timeout: "3m"
      auto_approve_handoffs: false
      auto_merge: false
      skip_approval: false
      session_continuity: true
      max_concurrent_tasks: 1
      invoke:
        type: prompt
        template_file: /etc/ailang-config/templates/pkg-update.md
        template_by_message_type:
          feedback: /etc/ailang-config/templates/pkg-feedback.md
      output_markers:
        - "FEEDBACK_ACTION:"
        - "ISSUE_URL:"
        - "PR_URL:"
        - "DECISION:"
      artifact_patterns:
        - "packages/test-pkg/**/*"
      # guardrails: allow push to feature branch so docs PRs can be opened,
      # but auto_merge=false above ensures a human approves before merge.
      git_mode: guardrails

    # Cascade-fixture dependent of sunholo/test_pkg. When test_pkg publishes
    # a new version, the M-PKG-AUTONOMOUS-CASCADE-SAFE flow routes a cascade
    # message to this inbox. Agent bumps the dependency in ailang.toml,
    # runs ailang check + test, and opens a PR labeled "smoke-test".
    # Used by scripts/integration/test_cascade_e2e.sh.
    - id: pkg-sunholo-test-pkg-consumer
      label: "Package: sunholo/test_pkg_consumer (cascade smoke fixture)"
      inbox: "pkg:sunholo/test_pkg_consumer"
      workspace: sunholo-data/ailang-packages

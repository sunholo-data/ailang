    # ═══════════════════════════════════════════════════════════
    # WEBSITE BUILDER
    # ═══════════════════════════════════════════════════════════

    - id: website-builder
      label: "Website Builder"
      inbox: website-builder
      workspace: sunholo-data/sunholo-websites
      capabilities: [code, docs]
      provider: claude
      model: sonnet
      timeout: "15m"
      idle_timeout: "3m"
      trigger_on_complete: []
      auto_approve_handoffs: false
      auto_merge: false
      skip_approval: true  # Push directly to main, no approval step (user-specific subdirs)
      session_continuity: true
      max_concurrent_tasks: 1
      invoke:
        type: skill
        name: website-builder
      output_markers:
        - "BUILD_COMPLETE:"
        - "FILES_CREATED:"
      merge_branch: main
      plugins:
        marketplaces:
          - anthropics/claude-code
        install:
          - frontend-design@anthropics-claude-code

  github_sync:
    enabled: true
    repos:
      - repo: sunholo-data/ailang
        enabled: true
        interval_secs: 300
        target_inbox: design-doc-creator
        watch_labels: []
        resync_labels: true
        resync_interval_secs: 3600

      - repo: MarkEdmondson1234/TwilightGame
        enabled: true
        interval_secs: 300
        target_inbox: twilight-design-doc
        watch_labels: []

# Workspace configuration
workspaces:
  derive_from_path: false  # Cloud uses explicit workspace IDs
  mappings:
    - pattern: "sunholo-data/ailang*"
      workspace: "sunholo-data/ailang"
    - pattern: "sunholo-data/stapledons_voyage*"
      workspace: "sunholo-data/stapledons_voyage"
    - pattern: "MarkEdmondson1234/TwilightGame*"
      workspace: "MarkEdmondson1234/TwilightGame"
    - pattern: "sunholo-data/sunholo-websites*"
      workspace: "sunholo-data/sunholo-websites"
    - pattern: "sunholo-data/ailang-packages*"
      workspace: "sunholo-data/ailang-packages"

# Budget configuration
budgets:
  global:
    workspace_budget: 1000.0
    daily_budget: 500.0
    task_max_cost: 250.0
    warning_threshold: 0.8
  providers:
    claude:
      daily_budget: 300.0
      task_max_cost: 150.0
      hard_limit: false
      warning_threshold: 0.8
    gemini:
      daily_budget: 20.0
      task_max_cost: 10.0
      hard_limit: true
      warning_threshold: 0.75

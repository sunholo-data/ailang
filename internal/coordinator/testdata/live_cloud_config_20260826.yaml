# AILANG Cloud Coordinator Configuration
# M-CI-BUILD-SPEED prod smoke test 20260430T082604Z — verify <90s fast-path landing
# M-CI-BUILD-SPEED M4 verification: config-only trigger smoke test 20260429T094517Z
#
# This config is used by Cloud Run services. It mirrors the structure
# of ~/.ailang/config.yaml but with cloud-specific settings:
#   - No local paths (workspaces are git URLs)
#   - Pub/Sub enabled for messaging transport
#   - Firestore for storage (AILANG_STORAGE=gcp)

github:
  expected_user: sunholo-voight-kampff
  default_repo: sunholo-data/ailang
  create_labels:
    - ailang-message
  watch_labels: []
  auto_import: true

# Pub/Sub configuration (M-PUBSUB)
pubsub:
  enabled: true
  project_id: ""  # Set via AILANG_CLOUD_PROJECT env var
  topic_prefix: "ailang"
  laptop_subscription: false  # Cloud doesn't need laptop sub

# Coordinator configuration
coordinator:
  mode: cloud
  default_provider: claude

  agents:
    # ═══════════════════════════════════════════════════════════
    # AILANG CORE WORKFLOW
    # ═══════════════════════════════════════════════════════════

    - id: design-doc-creator
      label: "Design Doc Creator"
      inbox: design-doc-creator
      workspace: sunholo-data/ailang
      capabilities: [research, docs]
      provider: claude
      model: opus
      timeout: "20m"
      idle_timeout: "3m"
      trigger_on_complete: [sprint-planner]
      auto_approve_handoffs: false
      auto_merge: false
      session_continuity: true
      max_concurrent_tasks: 1
      invoke:
        type: skill
        name: design-doc-creator
      output_markers:
        - "DESIGN_DOC_PATH:"
      artifact_patterns:
        - "design_docs/**/*.md"
      approval:
        needs_label: needs-design-approval
        approved_label: design-approved
        github_comment_template: design_doc

    - id: sprint-planner
      label: "Sprint Planner"
      inbox: sprint-planner
      workspace: sunholo-data/ailang
      capabilities: [research, docs, planning]
      provider: claude
      timeout: "15m"
      idle_timeout: "3m"
      trigger_on_complete: [sprint-executor]
      auto_approve_handoffs: false
      auto_merge: false
      session_continuity: true
      max_concurrent_tasks: 1
      invoke:
        type: skill
        name: sprint-planner
      output_markers:
        - "SPRINT_PLAN_PATH:"
        - "SPRINT_JSON_PATH:"
      artifact_patterns:
        - "design_docs/**/*.md"
        - ".ailang/state/sprints/*.json"
      approval:
        needs_label: needs-sprint-approval
        approved_label: sprint-approved
        github_comment_template: sprint_plan

    - id: sprint-executor
      label: "Sprint Executor"
      inbox: sprint-executor
      workspace: sunholo-data/ailang
      capabilities: [code, test, docs]
      provider: claude
      model: opus
      executor_variant: go
      timeout: "60m"
      idle_timeout: "5m"
      trigger_on_complete: []
      auto_approve_handoffs: false
      auto_merge: false
      session_continuity: true
      max_concurrent_tasks: 1
      invoke:
        type: skill
        name: sprint-executor
      output_markers:
        - "IMPLEMENTATION_COMPLETE:"
        - "BRANCH_NAME:"
        - "FILES_CREATED:"
        - "FILES_MODIFIED:"
      artifact_patterns:
        - "**/*.go"
        - "**/*.md"
        - "**/*.json"
        - "**/*.ail"
      approval:
        needs_label: needs-implementation-approval
        approved_label: implementation-approved
        github_comment_template: implementation

    - id: coordinator
      label: "General Coordinator"
      inbox: coordinator
      workspace: sunholo-data/ailang
      capabilities: [code, test, docs, research]
      provider: claude
      trigger_on_complete: []
      auto_approve_handoffs: false
      auto_merge: false
      session_continuity: true
      max_concurrent_tasks: 2

    # M-COORD-TAG-ROUTING-LASTMILE (ailang v0.23.0): motoko as a cloud-side
    # worker. Tag-routed messages with `requires: ["agent:motoko"]` reach
    # this agent via the M-COORD-MULTI-HOST-WORKERS tag matcher; the cloud
    # coordinator dispatches them to the agent-executor-motoko Cloud Run
    # Job. The same tag is also advertised by the Studio bare-metal worker
    # (~/.ailang/config.yaml on the eval-rig agent), so when the Studio is
    # online it takes the work (prompt cache warm, lower latency); when
    # offline, this cloud Job picks up the slack.
    - id: motoko
      label: "Motoko (AILANG-native, OpenRouter-routed)"
      inbox: motoko
      workspace: sunholo-data/ailang
      capabilities: [code, test, docs]
      provider: motoko
      executor_variant: motoko
      worker_tags:
        - agent:motoko
      trigger_on_complete: []
      auto_approve_handoffs: false
      auto_merge: false
      session_continuity: false
      max_concurrent_tasks: 1
      timeout: "60m"
      idle_timeout: "5m"


      output_per_1k: 0.015    # $15.00 per 1M = $0.015 per 1K
    notes: |
      OpenAI's most capable and efficient frontier model (March 5, 2026).
      1M token context window (pricing doubles above 272K context).
      Native computer-use capabilities for agentic workflows.
      33% fewer errors than GPT-5.2, 18% fewer erroneous responses.
      Record scores on OSWorld-Verified and WebArena Verified.
      Cached input: $1.25/M (50% discount, applied automatically).
      Also available: gpt-5.4-thinking (reasoning), gpt-5.4-pro (high performance).
      Uses max_completion_tokens instead of max_tokens.

  opencode-gpt5-4:
    api_name: "gpt-5.4"
    provider: "openai"
    description: "GPT-5.4 via opencode harness — cross-harness comparison pair"
    env_var: "OPENAI_API_KEY"
    agent_cli: "opencode"
    agent_model_name: "openai/gpt-5.4"  # opencode provider/model format
    model_family: "gpt5-4"  # Cross-harness grouping: pairs with gpt5-4
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.0025
      output_per_1k: 0.015
    notes: |
      GPT-5.4 evaluated via the opencode CLI harness for cross-harness comparison.
      Use harness_suite to run both harnesses in one command.

  # OpenAI GPT-5.4-Mini (released March 17, 2026)
  gpt5-4-mini:
    api_name: "gpt-5.4-mini"
    provider: "openai"
    description: "GPT-5.4 Mini — cheaper same-gen sibling of gpt-5.4"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.00075   # $0.75 per 1M = $0.00075 per 1K
      output_per_1k: 0.0045   # $4.50 per 1M = $0.0045 per 1K
    # M-EVAL-COST-AND-SPEED-BUDGETS (v0.15.1 retro): default formula
    # ($0.0003*64 + $0.0012*32 = $0.192) is calibrated for single-call eval,
    # not multi-turn agent loops. v0.15.1 baseline showed -47pp regression
    # vs v0.15.0 because budget-killed mid-stream. Explicit $0.30 cap
    # restores agent-mode capacity. (Pricing actually ~$0.288 + $0.144 / 1M,
    # so formula resolves higher than initially feared but still tight for
    # multi-turn loops re-sending full context.)
    budgets:
      max_cost_usd: 0.30
      hard_timeout_secs: 600
    notes: |
      GPT-5.4 Mini (March 17, 2026) — same generation as gpt-5.4, ~3x cheaper.
      Use in dev_models for cost-effective iteration at current-gen quality.
      Also available: gpt-5.4-mini-2026-03-17 (pinned version).
      Uses max_completion_tokens instead of max_tokens.

  # OpenAI GPT-5.4-Nano (released March 17, 2026)
  gpt5-4-nano:
    api_name: "gpt-5.4-nano"
    provider: "openai"
    description: "GPT-5.4 Nano — ultra-cheap same-gen model for high-volume tasks"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.0002    # $0.20 per 1M = $0.0002 per 1K
      output_per_1k: 0.00125  # $1.25 per 1M = $0.00125 per 1K
    notes: |
      GPT-5.4 Nano (March 17, 2026) — same generation as gpt-5.4, ~12x cheaper.
      Cached input: $0.020/M (90% discount).
      Also available: gpt-5.4-nano-2026-03-17 (pinned version).
      Uses max_completion_tokens instead of max_tokens.

  # OpenAI GPT-5.2-Codex (released January 2026)
  gpt5-2-codex:
    api_name: "gpt-5.2-codex"
    provider: "openai"
    description: "GPT-5.2-Codex - top-of-the-line agentic coding model"
    env_var: "OPENAI_API_KEY"
    agent_cli: null  # Uses Responses API for text generation
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.00175   # $1.75 per 1M = $0.00175 per 1K
      output_per_1k: 0.014    # $14 per 1M = $0.014 per 1K
    notes: |
      OpenAI's most capable agentic coding model (Jan 2026).
      Built on GPT-5.2 with specialized coding fine-tuning.
      Same pricing as GPT-5.2 ($1.75/$14 per 1M).
      90% discount on cached tokens ($0.175/M).
      Uses Responses API (/v1/responses) - NOT Chat Completions API.
      Supports reasoning.effort parameter (none/low/medium/high).
      Supersedes gpt-5.1-codex-max for coding tasks.
      Eval support: ✅ Fully supported via Responses API.

  # OpenAI Codex-Mini-Latest (released January 2026)
  codex-mini-latest:
    api_name: "codex-mini-latest"
    provider: "openai"
    description: "Codex-Mini - fast, cheap coding model for simple tasks"
    env_var: "OPENAI_API_KEY"
    agent_cli: null  # Uses Responses API for text generation
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.0015    # $1.50 per 1M = $0.0015 per 1K
      output_per_1k: 0.006    # $6 per 1M = $0.006 per 1K
    notes: |
      Smaller, faster coding model for simple tasks (code completion, unit tests).
      Fine-tuned from o4-mini for Codex CLI use.
      Uses Responses API (/v1/responses) - NOT Chat Completions API.
      75% prompt caching discount ($0.375/M cached input).
      Heavy reasoning token usage - needs generous max_output_tokens.
      Good for extending usage limits (~4x cheaper than full codex models).
      Eval support: ✅ Supported via Responses API.

  # OpenAI GPT-5.1-Codex-Max (released December 2025)
  gpt5-1-codex-max:
    api_name: "gpt-5.1-codex-max"
    provider: "openai"
    description: "GPT-5.1-Codex-Max - purpose-built for agentic coding"
    env_var: "OPENAI_API_KEY"
    agent_cli: null  # Uses Responses API for text generation

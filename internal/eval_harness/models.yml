  # Anthropic Claude Haiku 4.5 (released October 2025)
  claude-haiku-4-5:
    api_name: "claude-haiku-4-5-20251001"
    provider: "anthropic"
    description: "Claude Haiku 4.5 - fastest and most cost-effective"
    env_var: "ANTHROPIC_API_KEY"
    agent_cli: "claude"  # Supports Claude Code CLI for agent evals
    agent_model_name: "haiku"  # Pass to --agent-model flag
    model_family: "claude-haiku-4-5"  # Cross-harness grouping: pairs with opencode-haiku
    max_output_tokens: 64000   # 64K max output (API limit for all Claude 4.5+)
    pricing:
      input_per_1k: 0.001   # $1.00 per million = $0.001 per 1K
      output_per_1k: 0.005  # $5.00 per million = $0.005 per 1K
    # M-EVAL-COST-AND-SPEED-BUDGETS (v0.15.1 retro): cheap-model agent budget.
    # Default formula = $0.224 — close to ceiling but multi-turn loops blow
    # past it. Explicit $0.30 keeps haiku-class agents from being killed

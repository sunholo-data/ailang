  # =============================================================================
  # OpenRouter-routed OS via opencode harness (M-AI-EFFECT-MODES, May 2026)
  #
  # Cross-harness comparison: same OS families we smoke-tested in standard
  # mode (single-shot, /tmp/eval_smoke_sota_os/), now via agent mode
  # (multi-turn iteration with tools, /tmp/eval_smoke_agent_or/ +
  # /tmp/eval_smoke_agent_motoko/).
  #
  # Headline finding 2026-05-04: GLM 5 (z.ai) PASSED 3/3 in agent mode —
  # first open-source model to clear the full smoke set. This validates
  # Motoko's recommendation. GLM 5 also beat gpt5-4-mini and gemini-3-1-pro
  # on csv_to_json (the gating benchmark from v0.14.2 baseline) at ~7×
  # lower cost than Claude Sonnet 4.6.
  #
  # Cross-harness behaviour observed:
  #   DeepSeek V4 Flash: 0/3 standard → 2/3 agent (+2; iteration unlocked)
  #   Qwen3 Coder Flash: 2/3 standard → 1/3 agent (-1; multi-turn confused it)
  #   Most others: same 0-2/3 in both modes (multi-turn doesn't compensate
  #     for never having seen AILANG)
  #
  # Per rule of thumb (must pass ALL smoke), entries below are categorised:
  #   PASS — earned a place in eval rotation
  #   NEAR-MISS — 2/3, on watchlist for stdlib/prompt improvement signal
  #   (cut entries removed from this file; smoke history retained in
  #    git log + eval_results/baselines/v0.14.x for re-verification)
  # =============================================================================

  # ---- PASS (3/3 smoke; in eval rotation) ----

  opencode-or-glm-5:
    api_name: "z-ai/glm-5"

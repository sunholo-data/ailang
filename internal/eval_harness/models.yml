    gcp_location: "global"
    max_output_tokens: 65536   # 65K max output (API limit)
    pricing:
      input_per_1k: 0.00125    # $1.25 per 1M = $0.00125 per 1K (≤200k context)
      output_per_1k: 0.01      # $10.00 per 1M = $0.01 per 1K (≤200k context)

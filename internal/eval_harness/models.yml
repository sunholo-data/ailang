# Default model for benchmarks
default: "claude-sonnet-4-6"

# =============================================================================
# MODEL SUITES
# =============================================================================
# Models defined in `models:` above are AVAILABLE but not automatically run.
# Only models listed in a suite below are included when that suite is invoked.
# This allows defining many models while controlling evaluation costs.
#
# Usage:
#   ailang eval-suite                    # Uses dev_models (cheap, fast)
#   ailang eval-suite --suite benchmark  # Uses benchmark_suite (core 3)
#   ailang eval-suite --full             # Uses extended_suite (top 6)
#   ailang eval-suite --models gpt5-2    # Run specific model(s)
# =============================================================================

# Core benchmark suite - top model from each provider (3 models)
# Use for: Regular CI, quick comparisons, development validation
benchmark_suite:
  - "gpt5-5"           # OpenAI flagship (Apr 2026)
  - "claude-opus-4-7"  # Anthropic flagship (Apr 2026)
  - "gemini-3-1-pro"   # Google flagship (Feb 2026)

# Extended suite - flagship + best alternatives (6 models)
# Use for: Release baselines, comprehensive comparisons
# Cost: ~$2-5 per full benchmark run
extended_suite:
  - "gpt5-5"           # OpenAI flagship (Apr 2026)
  - "gpt5-4-mini"      # OpenAI cheap (Mar 2026)
  - "claude-opus-4-7"  # Anthropic flagship (Apr 2026)
  - "claude-sonnet-4-6" # Anthropic best for coding (Feb 2026)
  - "gemini-3-1-pro"   # Google flagship (Feb 2026)
  - "gemini-3-flash"   # Google fast + cheap (Dec 2025)
  - "or-glm-5"         # z.ai GLM 5 via OpenRouter — first OS PASS smoke (added v0.15.0)
  - "or-minimax-m2-7"  # MiniMax M2.7 via OpenRouter — second OS PASS smoke (added v0.15.0)

# Development models - cheap and fast (3 models)
# Use for: Development iteration, testing eval infrastructure
# Cost: ~$0.10-0.50 per full benchmark run
dev_models:
  - "gpt5-4-mini"      # OpenAI cheap same-gen as gpt5-4 (Mar 2026)
  - "claude-haiku-4-5" # Anthropic cheap
  - "gemini-3-flash"   # Google cheap + smart (Dec 2025)

# Agent CLI suite - one model per agentic CLI harness (M-EXEC-EXPAND / v0.15.0)
# Use for: Cross-harness agent evals (claude + gemini + codex, opencode added
# later in M7 of M-EXEC-EXPAND). Only models whose agent_cli is non-null
# participate in agent-mode runs; the rest are skipped cleanly.
# Cost: ~$1-2 per full benchmark run (depends on task complexity)
agent_suite:
  - "claude-sonnet-4-6"     # agent_cli: "claude"    — kept as longitudinal anchor across releases
  - "gemini-3-flash"        # agent_cli: "gemini"    — Google cheap (already lowest tier)
  - "gpt5-4-mini"           # agent_cli: "codex"     — OpenAI cheap (was gpt5-4, swapped to keep cost down)
  # opencode-sonnet-4-6 and motoko-claude-sonnet-4-6 removed (2026-05-16, v0.20.0
  # post-release): sonnet-4-6 is already the longitudinal anchor via its native
  # claude-code harness slot above; the cross-harness duplicates inflated cost
  # without adding signal. Use `harness_suite` (--cross-harness flag) for explicit
  # cross-harness comparison runs that genuinely need same-model-different-CLI pairs.
  - "opencode-or-glm-5"     # agent_cli: "opencode"  — GLM 5 via OpenRouter (PASS smoke 3/3, 2026-05-04, first OS) — added v0.15.0
  - "opencode-or-minimax-m2-7" # agent_cli: "opencode" — MiniMax M2.7 via OpenRouter (PASS smoke 3/3, 2026-05-04, cheapest OS) — added v0.15.0
  - "opencode-or-glm-4-7-flash" # agent_cli: "opencode" — GLM 4.7 Flash via OpenRouter (PASS smoke 3/3 with budgets:hard_timeout_secs=600, 2026-05-05) — added v0.15.1 via M-EVAL-COST-AND-SPEED-BUDGETS
  - "motoko-claude-haiku-4-5"   # agent_cli: "motoko" — AILANG-native harness on cheap model (M-MOTOKO-EXECUTOR-ADAPTER, v0.18.0) — THE threshold-measurement experiment
  - "motoko-glm-5"              # agent_cli: "motoko" — AILANG-native harness on top-OS model (cost-arbitrage thesis)
  - "motoko-gemma-4"            # agent_cli: "motoko" — AILANG-native harness on open-weight Gemma (no first-party Gemma agent CLI)

# Language × Harness suite - cheapest model per harness for 4-language sweep
# Use for: Post-release language/harness Explorer data (ailang,python,js,go × 4 harnesses)
# One cheap representative per harness so the 4-language cost stays manageable.
# Cost: ~$0.30-0.60 per core-tier run across all 4 langs
lang_harness_suite:
  - "claude-haiku-4-5"   # Anthropic cheapest — agent_cli: "claude"
  - "gemini-3-flash"     # Google cheapest — agent_cli: "gemini"
  - "gpt5-4-mini"        # OpenAI cheapest — agent_cli: "codex"
  - "opencode-haiku"     # opencode cheapest — agent_cli: "opencode"

ollama_suite:
  - "opencode-gemma4-e4b"   # Gemma 4 E4B — 16GB laptop, relaxed TTFT (300s)
  - "opencode-gemma4-26b"   # Gemma 4 26B — 32GB Mac, relaxed TTFT (480s)

harness_suite:
  - "claude-sonnet-4-6"        # Sonnet via Claude Code CLI
  - "opencode-sonnet-4-6"      # Sonnet via opencode harness
  - "pi-claude-sonnet-4-6"     # Sonnet via pi minimal harness (3-way claude-sonnet-4-6 family)
  - "motoko-claude-sonnet-4-6" # Sonnet via motoko AILANG-native harness (4-way claude-sonnet-4-6 family)
  - "gemini-3-flash"           # Gemini Flash via Gemini CLI
  - "opencode-gemini-3-flash"  # Gemini Flash via opencode harness (ailang-dev + global location)
  - "gpt5-5"                   # GPT-5.5 via Codex CLI harness (Apr 2026)
  - "opencode-gpt5-5"          # GPT-5.5 via opencode harness (cross-harness comparison)

# Local models - free, offline, privacy-preserving (4 models)
# Use for: Offline development, cost-free iteration, privacy-sensitive code
# Cost: $0.00 (runs locally via Ollama)
# Requires: ollama serve running locally
local_models:
  - "ollama-codellama"          # CodeLlama 7B
  - "ollama-deepseek-coder"     # DeepSeek Coder 6.7B
  - "ollama-qwen-coder"         # Qwen 2.5 Coder 7B
  - "ollama-llama3-2"           # Llama 3.2 3B (fast)
  - "ollama-granite3-2-vision"  # IBM Granite 3.2 Vision (document OCR)
  - "ollama-paddleocr-vl"       # PaddleOCR-VL 0.9B (lightweight OCR)


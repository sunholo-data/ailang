  # SOTA open-source via OpenRouter — NEAR-MISS WATCHLIST (2026-05-04)
  #
  # 13 SOTA OS models (Qwen3, Gemma 4, DeepSeek V4, Moonshot Kimi)
  # smoke-tested against fizzbuzz/adt_option/csv_to_json. Proprietary
  # baselines (claude-sonnet-4-6, gpt5-mini) passed all 3; the OS
  # models did not. Per rule of thumb, only models passing ALL smoke
  # tests enter the eval rotation.

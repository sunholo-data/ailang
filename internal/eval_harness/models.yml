    provider: "anthropic"
    description: "Claude Opus 4.5 - most intelligent model"
    env_var: "ANTHROPIC_API_KEY"
    agent_cli: "claude"  # Supports Claude Code CLI for agent evals
    agent_model_name: "opus"  # Pass to --agent-model flag

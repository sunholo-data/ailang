# AILANG Evaluation Model Configuration
# Last updated: April 2026
#
# This file defines the canonical model names for evaluation benchmarks.
# Update this file when new model versions are released.

# Model definitions
models:
  # OpenAI GPT-5 (released August 2025)
  gpt5:
    api_name: "gpt-5"
    provider: "openai"
    description: "GPT-5 full reasoning model"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 128000  # 128K max output (API limit)
    pricing:
      input_per_1k: 0.00125   # $1.25 per 1M = $0.00125 per 1K
      output_per_1k: 0.01      # $10 per 1M = $0.01 per 1K
    notes: |
      Main GPT-5 model with reasoning capabilities.
      90% discount on cached tokens ($0.125/M).
      Use for production benchmarks.
      Agent eval support: Not yet implemented (requires OpenAI Codex CLI).

  gpt5-mini:
    api_name: "gpt-5-mini"
    provider: "openai"
    description: "GPT-5 mini (faster, cheaper)"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 128000  # 128K max output (API limit)
    pricing:
      input_per_1k: 0.00025   # $0.25 per 1M = $0.00025 per 1K (~1/5 of GPT-5)
      output_per_1k: 0.002     # $2 per 1M = $0.002 per 1K
    notes: "Smaller variant, ~1/5 the price of GPT-5. Agent eval: Not yet supported."

  # OpenAI GPT-5.1 (released November 2025)
  gpt5-1:
    api_name: "gpt-5.1"
    provider: "openai"
    description: "GPT-5.1 with adaptive reasoning"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 128000  # 128K max output (API limit)
    pricing:
      input_per_1k: 0.00125   # $1.25 per 1M = $0.00125 per 1K
      output_per_1k: 0.01      # $10 per 1M = $0.01 per 1K
    notes: |
      GPT-5.1 (Thinking mode) with adaptive reasoning.
      Dynamically adjusts thinking time based on task complexity.
      Same pricing as GPT-5, but may use fewer tokens on simple tasks.
      Reasoning tokens tracked separately in usage stats.
      24-hour extended prompt caching available.
      Uses max_completion_tokens instead of max_tokens.
      Agent eval support: Not yet implemented (requires OpenAI Codex CLI).

  gpt5-1-instant:
    api_name: "gpt-5.1-chat-latest"
    provider: "openai"
    description: "GPT-5.1 Instant (fast, general purpose)"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.00125   # $1.25 per 1M = $0.00125 per 1K
      output_per_1k: 0.01      # $10 per 1M = $0.01 per 1K
    notes: |
      GPT-5.1 Instant - faster, more conversational variant.
      Can use adaptive reasoning on complex tasks while staying fast on simple ones.
      Same pricing as GPT-5.1 Thinking mode.
      Good for development iteration with high intelligence.
      Uses max_completion_tokens instead of max_tokens.
      Agent eval support: Not yet implemented (requires OpenAI Codex CLI).

  # OpenAI GPT-5.2 (released December 2025)
  gpt5-2:
    api_name: "gpt-5.2"
    provider: "openai"
    description: "GPT-5.2 Thinking - 40% smarter than GPT-5.1"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.00175   # $1.75 per 1M = $0.00175 per 1K
      output_per_1k: 0.014    # $14 per 1M = $0.014 per 1K
    notes: |
      GPT-5.2 Thinking mode with enhanced reasoning capabilities.
      40% improvement over GPT-5.1 at 40% higher cost.
      400K token context window, 128K max output tokens.
      Knowledge cutoff: August 31, 2025.
      Uses max_completion_tokens instead of max_tokens.
      Also available: gpt-5.2-chat-latest (Instant), gpt-5.2-pro.
      Agent eval support: Not yet implemented (requires OpenAI Codex CLI).

  gpt5-2-instant:
    api_name: "gpt-5.2-chat-latest"
    provider: "openai"
    description: "GPT-5.2 Instant (fast, daily tasks)"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.00175   # $1.75 per 1M = $0.00175 per 1K
      output_per_1k: 0.014    # $14 per 1M = $0.014 per 1K
    notes: |
      GPT-5.2 Instant - optimized for speed and daily tasks.
      Same pricing as GPT-5.2 Thinking but faster response times.
      Good for development iteration where speed matters.
      Uses max_completion_tokens instead of max_tokens.
      Agent eval support: Not yet implemented (requires OpenAI Codex CLI).

  # OpenAI GPT-5.5 (released April 23, 2026)
  gpt5-5:
    api_name: "gpt-5.5"
    provider: "openai"
    description: "GPT-5.5 - new flagship reasoning model with 1M context"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    model_family: "gpt5-5"  # Cross-harness grouping: pairs with opencode-gpt5-5
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.005     # $5.00 per 1M = $0.005 per 1K
      output_per_1k: 0.030    # $30.00 per 1M = $0.030 per 1K
    notes: |
      OpenAI's new flagship reasoning model (April 23, 2026).
      ⚠️ 2x more expensive than GPT-5.4 ($2.50/$15 → $5/$30 per 1M).
      1.05M token context window, 128K max output tokens.
      Knowledge cutoff: December 1, 2025.
      Adaptive reasoning with reasoning_tokens (like o1/o3 style).
      Supports reasoning.effort: none/minimal/low/medium/high/xhigh (default: medium).
      Cached input: $0.50/M (90% discount).
      Batch/Flex API: 50% off ($2.50/$15 per 1M).
      Also available: gpt-5.5-pro ($30/$180 per 1M — 6x base price, run with --models gpt5-5-pro).
      Uses max_completion_tokens instead of max_tokens.

  opencode-gpt5-5:
    api_name: "gpt-5.5"
    provider: "openai"
    description: "GPT-5.5 via opencode harness — cross-harness comparison pair"
    env_var: "OPENAI_API_KEY"
    agent_cli: "opencode"
    agent_model_name: "openai/gpt-5.5"  # opencode provider/model format
    model_family: "gpt5-5"               # Cross-harness grouping: pairs with gpt5-5
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.005
      output_per_1k: 0.030
    notes: |
      GPT-5.5 evaluated via the opencode CLI harness for cross-harness comparison.
      Use harness_suite to run both harnesses in one command.
      Note: opencode harness has historically been more cost-efficient than codex
      for the gpt5-4 generation (2x cheaper, slightly higher pass rate).

  # OpenAI GPT-5.5 Pro (released April 23, 2026)
  gpt5-5-pro:
    api_name: "gpt-5.5-pro"
    provider: "openai"
    description: "GPT-5.5 Pro - high-performance variant (6x base price)"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    model_family: "gpt5-5-pro"  # Cross-harness grouping: pairs with opencode-gpt5-5-pro
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.030     # $30.00 per 1M = $0.030 per 1K
      output_per_1k: 0.180    # $180.00 per 1M = $0.180 per 1K
    notes: |
      GPT-5.5 Pro - high-performance variant (April 23, 2026).
      ⚠️ 6x more expensive than gpt-5.5 base ($30/$180 vs $5/$30 per 1M).
      ❌ Agent mode NOT supported (Apr 2026):
         - codex CLI rejects with "not supported when using Codex with a ChatGPT account"
         - opencode harness returns 0 tool calls (Pro tier disables tool use)
      Currently usable for standard (non-agent) eval mode only.
      Same context/reasoning as gpt-5.5.
      Uses max_completion_tokens instead of max_tokens.

  opencode-gpt5-5-pro:
    api_name: "gpt-5.5-pro"
    provider: "openai"
    description: "GPT-5.5 Pro via opencode harness — cross-harness comparison pair"
    env_var: "OPENAI_API_KEY"
    agent_cli: "opencode"
    agent_model_name: "openai/gpt-5.5-pro"  # opencode provider/model format
    model_family: "gpt5-5-pro"               # Cross-harness grouping: pairs with gpt5-5-pro
    max_output_tokens: 128000
    pricing:
      input_per_1k: 0.030
      output_per_1k: 0.180
    notes: |
      GPT-5.5 Pro via the opencode CLI harness for cross-harness comparison.
      ⚠️ 6x more expensive than gpt-5.5 base — use sparingly.
      Use harness_suite to run both harnesses in one command.

  # OpenAI GPT-5.4 (released March 5, 2026)
  gpt5-4:
    api_name: "gpt-5.4"
    provider: "openai"
    description: "GPT-5.4 - most powerful OpenAI model with 1M context and computer-use"
    env_var: "OPENAI_API_KEY"
    agent_cli: "codex"
    model_family: "gpt5-4"  # Cross-harness grouping: pairs with opencode-gpt5-4
    max_output_tokens: 128000  # 128K max output (API limit)

    pricing:
      input_per_1k: 0.0
      output_per_1k: 0.0
    notes: |
      Variant of gemma4:26b with sampling parameters tuned for agentic AILANG
      code generation, derived from the 2026-05-23 sampling-collapse incident.

      Modelfile (tools/ollama/gemma4-26b-ailang.modelfile) bakes in ollama-native
      params that do NOT pass through /v1/chat/completions:
        top_k=64 (Google official)
        repeat_penalty=1.1 (community consensus for agentic tool-calls;
                            kept ≤1.1 since >1.1 hurts code per smcleod.net guide)
        repeat_last_n=256
        min_p=0.05 (Unsloth-recommended safety floor)
        num_predict=4096 (hard cap on single-generation output)

      opencode.jsonc model options (must travel via OpenAI-compatible names):
        temperature=0.5 (Gemma 4 agentic-loop middle ground; Google official is
                         1.0 but the 26b MoE has documented collapse issues at 1.0)
        top_p=0.95 (Google official)
        frequency_penalty=0.3 (OpenAI-compat counterpart of repeat_penalty)
        max_tokens=4096

      Build the variant: ollama create gemma4:26b-ailang -f tools/ollama/gemma4-26b-ailang.modelfile

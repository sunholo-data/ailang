    env_var: "OPENROUTER_API_KEY"
    agent_cli: "motoko"
    agent_model_name: "openrouter/anthropic/claude-haiku-4-5"
    model_family: "claude-haiku-4-5"                 # Pairs with claude-haiku-4-5 + opencode-haiku + pi-claude-haiku-4-5
    max_output_tokens: 16000
    pricing:
      input_per_1k: 0.00025
      output_per_1k: 0.00125
    notes: |
      Claude Haiku 4.5 evaluated via the motoko_agent harness — the FIRST
      AILANG-native agent in the eval suite. Routes via OpenRouter so this
      entry uses OPENROUTER_API_KEY (NOT ANTHROPIC_API_KEY) — matches the
      cost-control rule from EXECUTOR_SHAPE.md §8 (motoko's cloud Job
      explicitly omits Anthropic API key bindings).
      Cross-harness threshold-measurement experiment: pair against
      vanilla claude-haiku-4-5 to quantify the harness lift (DP7 verifier

  gemini-2-5-pro:
    api_name: "gemini-2.5-pro"
    provider: "google"
    description: "Gemini 2.5 Pro with thinking"
    env_var: ""  # Eval harness uses Vertex AI ADC (gcloud auth application-default login). GOOGLE_API_KEY only used by AI Studio path in builtins/ai.go.
    agent_cli: "gemini"  # Supports Gemini CLI for agent evals

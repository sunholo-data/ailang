    description: "GLM 5 (z.ai) via opencode+OpenRouter — first OS model to PASS full AILANG smoke"
    env_var: "OPENROUTER_API_KEY"
    agent_cli: "opencode"
    agent_model_name: "openrouter/z-ai/glm-5"
    model_family: "glm-5"
    max_output_tokens: 32768
    pricing:
      input_per_1k: 0.0006   # $0.60 per 1M
      output_per_1k: 0.00208 # $2.08 per 1M
    # M-EVAL-COST-AND-SPEED-BUDGETS (v0.15.1): explicit OS parity budget.
    # Default formula resolves to $0.105 — generous bump to $0.30 matches the
    # 4 OS near-misses tested in M5, gives multi-turn agent loops headroom.
    budgets:
      max_cost_usd: 0.30
      hard_timeout_secs: 600
    notes: |
      Agent-mode smoke 2026-05-04: 3/3 (fizzbuzz✅ adt_option✅ csv_to_json✅).
      First OS model to pass the full smoke set. ~7× cheaper than Claude
      Sonnet 4.6 ($3/$15 per 1M) on input. Beat gpt5-4-mini and
      gemini-3-1-pro on csv_to_json (the gating benchmark from v0.14.2).
      Recommended by Motoko for AILANG eval.


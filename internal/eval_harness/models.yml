  # Google Gemini 3.5 Flash (released May 19, 2026 at Google I/O 2026)
  # ⚠️  EXCLUDED FROM STANDARD EVAL ROTATION (v0.22.0, 2026-05-20).
  # The Vertex Managed Agents API path is cost-prohibitive due to a documented
  # Google API limitation: implicit + explicit context caching are BOTH disabled
  # when the request includes system_instruction, tools, or tool_config. The
  # Antigravity agent harness uses all three by definition, so no caching is
  # possible on this code path. Result: 15.7× more expensive per run than
  # legacy gemini-cli/gemini-3-flash on the v0.20.0 baseline (avg $1.79 vs
  # $0.11 per run; 93.5% of cost is input-token re-send across many turns).
  #
  # Entry is kept for explicit `--models gemini-3-5-flash` invocations and is
  # NOT added to agent_suite / benchmark_suite / extended_suite / dev_models.
  # Re-evaluate when Google ships either (a) a tools-compatible cache mode,
  # (b) static-prefix caching for system_instruction + tool definitions, or
  # (c) cachedContentTokenCount exposed in /interactions usage payloads.
  # Standard-mode (direct Vertex generateContent) for gemini-3-5-flash is
  # UNAFFECTED and remains in the standard baseline (88.2% AILANG).
  gemini-3-5-flash:
    api_name: "gemini-3.5-flash"
    provider: "google"
    description: "Gemini 3.5 Flash - strongest Flash model; agent-mode EXCLUDED from standard suites (caching incompatible with tools)"
    env_var: ""  # Eval harness uses Vertex AI ADC (gcloud auth application-default login).
    agent_cli: "managed_agents"                        # Vertex Managed Agents API via ADC (M-MANAGED-AGENTS, v0.22.0)
    agent_model_name: "antigravity-preview-05-2026"   # Public Antigravity agent name (server-side runs gemini-3.5-flash)
    gcp_project: "ailang-dev"
    gcp_location: "global"
    max_output_tokens: 65536   # 64K max output (model spec), 65536 = next power-of-two ceiling
    pricing:
      input_per_1k: 0.0015     # $1.50 per 1M = $0.0015 per 1K
      output_per_1k: 0.009     # $9.00 per 1M = $0.009 per 1K
    # Budget intentionally tight to make over-runs LOUD in stderr (executor
    # post-hoc reports overruns via managed_agents_cost_over_budget). With
    # caching disabled by Google API limitation, real runs average ~$1.79 —
    # ~6× over this nominal budget. Tightening further would just suppress
    # the warning without changing the underlying cost.
    budgets:
      max_cost_usd: 0.30
      hard_timeout_secs: 600
    notes: |
      Google's newest Flash model (released May 19, 2026 at Google I/O 2026).
      First model in the Gemini 3.5 family. Strongest agentic/coding Flash to date:
      beats Gemini 3.1 Pro on Terminal-Bench 2.1 (76.2 vs 70.3), MCP Atlas (83.6 vs 78.2),
      Finance Agent v2 (57.9 vs 43.0), and GDPval-AA Elo (1656 vs 1314).
      Knowledge cutoff: January 2026. 1M token input context, 64K output.
      Pricing: $1.50/$9.00 per 1M tokens. Cached input would be $0.15 per 1M.
      Has adaptive reasoning (separate thoughtsTokenCount in usage metadata).
      Available on Vertex AI global endpoint and AI Studio.
      Requires gcloud auth (uses Vertex AI Managed Agents API via ADC).

      Agent eval support (M-MANAGED-AGENTS, v0.22.0): ✅ executor works via
      internal/executor/managed_agents/ — POST aiplatform.googleapis.com/v1beta1
      /.../interactions with Api-Revision: 2026-05-20 header. Server-side
      sandbox + multi-turn state.

      ⚠️  CAVEAT: NOT in standard eval rotation until Google fixes the
      tools-incompatible caching restriction. See header comment block above
      this entry for full context + v0.20.0 baseline cost numbers ($82 for 46
      core agent runs vs $5 for the same set on gemini-cli). For one-off
      validation, explicit invocation works:
        ailang eval-suite --agent --models gemini-3-5-flash --benchmarks ...


# govulncheck allowlist for AILANG
#
# Each entry suppresses a specific govulncheck finding from causing CI
# failure. Entries MUST have an `expires` date — once that date passes,
# the CI gate fails on the entry, forcing manual review.
#
# Format:
#   - id: GO-YYYY-NNNN          # the govulncheck Vulnerability ID
#     reason: <one-line>        # why we're not fixing this directly
#     expires: YYYY-MM-DD       # when this allowlist entry self-expires
#
# To add a new entry: explain in `reason` whether the upstream fix is
# pending, the dependency is being phased out, or the finding is a
# false positive for AILANG's call paths. Default expiry is 90 days.
#
# Reviewed: post-release skill prompts a check of expiries.
#
# The nine Ollama entries (GO-2026-5750 and eight GO-2025-*) were deleted
# 2026-11-10 together with the module: internal/ai/ollama/wire replaced
# github.com/ollama/ollama/api, so no ollama package is linked any more
# (`go list -deps ./... | grep -c ollama/ollama` is 0).

allow: []

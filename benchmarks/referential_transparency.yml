id: referential_transparency
description: "Referential transparency: same input -> same output (determinism)"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "easy"
expected_gain: "very_high"
task_prompt: |
  Write a program in <LANG> that demonstrates referential transparency.

  Requirements:
  1. Implement a PURE function `compute(x, y)` that returns x * 2 + y
  2. Call compute(5, 3) THREE TIMES and store each result
  3. Verify all three results are identical
  4. Print: "All results equal: true" if all are the same, "All results equal: false" otherwise

  Constraints:
  - Function MUST be pure (no side effects, no randomness, no hidden state)
  - Same inputs MUST produce same output every time
  - No global variables, no I/O inside compute()

  Expected behavior:
  compute(5, 3) = 13
  compute(5, 3) = 13  (same result)
  compute(5, 3) = 13  (same result)

  Expected output:
  "All results equal: true"

  Output only the code, no explanations.
expected_stdout: |
  All results equal: true

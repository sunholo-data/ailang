id: adt_option
description: "Option/Maybe monad operations (algebraic data types)"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "very_high"
task_prompt: |
  Write a program in <LANG> that:
  1. Defines an Option type (Some/None, or equivalent)
  2. Implements a safe square root function that returns Option[Float]
     - Returns Some(sqrt(n)) if n >= 0
     - Returns None if n < 0 (can't take sqrt of negative)
  3. Tests the function with: safeSqrt(16.0) and safeSqrt(-4.0)
  4. Prints the results:
     - For Some(value): print "Root: {value}"
     - For None: print "Error: Negative input"

  Output only the code, no explanations.
expected_stdout: |
  Root: 4.0
  Error: Negative input
tier: smoke
tags: [adt_pattern_match]

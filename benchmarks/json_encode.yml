id: json_encode
description: "Build and encode nested JSON (data serialization)"
languages: ["python", "ailang", "javascript", "go", "moonbit", "aver"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "high"
prompt: |
  Write a program in <LANG> that:
  1. Creates a nested JSON structure representing:
     - A product object with name "Gadget", price 149, inStock status true
     - An array of tags: ["electronics", "sale", "featured"]
     - A nested dimensions object: width 10, height 5, depth 3
  2. Encodes it to a JSON string
  3. Prints the JSON string

  The output should be valid JSON with this structure:
  {"name":"Gadget","price":149,"inStock":true,"tags":["electronics","sale","featured"],"dimensions":{"width":10,"height":5,"depth":3}}

  Output only the code, no explanations.
expected_stdout: |
  {"name":"Gadget","price":149,"inStock":true,"tags":["electronics","sale","featured"],"dimensions":{"width":10,"height":5,"depth":3}}
tier: smoke
tags: [data_transform, string_algo]

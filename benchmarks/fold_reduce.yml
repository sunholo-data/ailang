id: fold_reduce
description: "Implement fold/reduce and use for sum, product, max (higher-order functions)"
languages: ["python", "ailang", "javascript", "go", "moonbit", "aver"]
entrypoint: "main"
caps: ["IO"]
difficulty: "hard"
expected_gain: "high"
task_prompt: |
  Write a program in <LANG> that:

  1. Implements a generic `foldl(f, acc, xs)` function that:
     - Takes a binary function f, an initial accumulator, and a list
     - Returns the result of folding the function over the list from left to right

  2. Uses foldl to compute:
     - Sum of [2, 4, 6, 8, 10] using addition
     - Product of [2, 4, 6, 8, 10] using multiplication
     - Maximum of [7, 2, 8, 3, 11, 5, 1]

  3. Prints three lines:
     - Sum: {value}
     - Product: {value}
     - Max: {value}

  Expected:
  - Sum: 2+4+6+8+10 = 30
  - Product: 2*4*6*8*10 = 3840
  - Max of [7,2,8,3,11,5,1] = 11

  Output only the code, no explanations.
expected_stdout: |
  Sum: 30
  Product: 3840
  Max: 11
tier: core
tags: [functional, recursion]

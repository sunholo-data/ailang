id: json_parse
description: "Parse JSON array, filter, and output (data parsing)"
languages: ["python", "ailang", "javascript", "go"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "medium"
task_prompt: |
  Write a program in <LANG> that:
  1. Parses this JSON array: [{"item":"Laptop","price":999},{"item":"Mouse","price":25},{"item":"Monitor","price":350},{"item":"Cable","price":12}]
  2. Filters to keep only items priced over 100
  3. Prints the item names, one per line

  Output only the code, no explanations.
expected_stdout: |
  Laptop
  Monitor
tier: smoke
tags: [string_algo, data_transform, adt_pattern_match]

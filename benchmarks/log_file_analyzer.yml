  <LANG=PYTHON>
  Write to: solution.py

  ```python
  import re

  # Create log file
  log_content = """2024-10-29 10:00:00 INFO User logged in: alice
  2024-10-29 10:01:15 ERROR Database connection failed
  2024-10-29 10:02:30 INFO User logged in: bob
  2024-10-29 10:03:45 WARNING High memory usage: 85%
  2024-10-29 10:05:00 ERROR API timeout: /users endpoint
  2024-10-29 10:06:15 INFO User logged out: alice"""

  with open("app.log", "w") as f:
      f.write(log_content)

  # Parse log
  counts = {"INFO": 0, "ERROR": 0, "WARNING": 0}
  users = set()

  with open("app.log", "r") as f:
      for line in f:
          parts = line.strip().split()
          if len(parts) >= 3:
              level = parts[2]
              counts[level] += 1

              # Extract users
              if "alice" in line.lower():
                  users.add("alice")
              if "bob" in line.lower():
                  users.add("bob")

  total = sum(counts.values())

  # Print results
  print(f"Total log entries: {total}")
  print(f"INFO: {counts['INFO']} ({counts['INFO']*100//total}%)")
  print(f"ERROR: {counts['ERROR']} ({counts['ERROR']*100//total}%)")
  print(f"WARNING: {counts['WARNING']} ({counts['WARNING']*100//total}%)")
  print(f"Unique users: {', '.join(sorted(users))}")
  ```


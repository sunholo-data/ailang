     ```

  2. **Parse log entries**:
     - Each line has format: "{timestamp} {level} {message}"
     - Extract: timestamp (string), level (INFO/ERROR/WARNING), message (string)
     - Split by spaces to parse

  3. **Compute statistics**:
     - Total number of log entries: 6
     - Count by level:
       * INFO: 3 entries
       * ERROR: 2 entries
       * WARNING: 1 entry
     - Calculate percentages (round to nearest int)
     - Extract unique users mentioned in messages (alice, bob)

  4. **Output format** (print to stdout):
     ```
     Total log entries: 6
     INFO: 3 (50%)
     ERROR: 2 (33%)
     WARNING: 1 (17%)
     Unique users: alice, bob
     ```


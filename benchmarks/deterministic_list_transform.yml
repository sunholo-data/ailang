id: deterministic_list_transform
description: "One canonical way vs multiple correct answers (Vision Problem 2)"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "easy"
expected_gain: "very_high"
task_prompt: |
  Write a program in <LANG> that transforms a list by doubling each element.

  Requirements:
  - Given list: [1, 2, 3, 4, 5]
  - Transform: multiply each element by 2
  - Print the result as a comma-separated string: "2, 4, 6, 8, 10"

  Use the MOST CANONICAL, IDIOMATIC way in <LANG> to transform the list.
  Avoid loops, list comprehensions with side effects, or complex lambda expressions.

  Output only the code, no explanations.
expected_stdout: |
  2, 4, 6, 8, 10

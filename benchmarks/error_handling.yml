id: error_handling
description: "Result/Either type for error propagation"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "high"
task_prompt: |
  Write a program in <LANG> that:
  1. Defines a Result type with Ok(value) and Err(message) variants
  2. Implements a function `validate_age(age: int) -> Result[int]`:
     - Returns Ok(age) if age is between 0 and 150 (inclusive)
     - Returns Err("Age out of range") otherwise
  3. Implements a function `calculate_retirement_years(age: int) -> Result[int]`:
     - Returns Ok(65 - age) if age < 65
     - Returns Err("Already retired") if age >= 65
  4. Chains operations: validate_age(age) -> calculate_retirement_years(result)
  5. Prints the final result:
     - For Ok(value): "Years to retirement: {value}"
     - For Err(msg): "Error: {msg}"

  Test cases:
  - age = 30 -> "Years to retirement: 35"
  - age = 70 -> "Error: Already retired"
  - age = -5 -> "Error: Age out of range"

  Output only the code, no explanations.
expected_stdout: |
  Years to retirement: 35
  Error: Already retired
  Error: Age out of range

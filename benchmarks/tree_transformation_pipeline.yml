id: tree_transformation_pipeline
description: "Recursive tree transformations with higher-order functions and ADTs"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "very_hard"
expected_gain: "very_high"
timeout: 120  # Hard complexity: 120 seconds
task_prompt: |
  Implement a binary tree transformation pipeline in <LANG> with recursive operations and higher-order functions.

  <LANG=AILANG> Write to: benchmark/solution.ail

  **Task Requirements**:

  1. **Define Tree ADT** (2 variants):
     ```ailang
     type Tree =
       | Leaf(int)                        // Leaf node with value
       | Node(Tree, int, Tree)            // Internal node: (left, value, right)
     ```

  2. **Implement mapTree(fn: int -> int, tree: Tree) -> Tree**:
     - Recursively apply function to all values
     - Return new tree with transformed values

  3. **Implement foldTree(fn: int -> int -> int, acc: int, tree: Tree) -> int**:
     - In-order fold over tree values
     - Combine all values using the function

  4. **Implement treeToList(tree: Tree) -> List[int]**:
     - In-order traversal to list
     - Used for printing results

  5. **Test with example tree**:
     ```
           5
          / \
         3   8
        /   / \
       1   7   9
     ```

     Represented as:
     ```ailang
     Node(
       Node(Leaf(1), 3, Leaf(0)),  // left: 3 with left child 1 (no right child, use dummy Leaf(0))
       5,
       Node(Leaf(7), 8, Leaf(9))   // right: 8 with children 7 and 9
     )
     ```

  6. **Operations to perform**:
     - **Original**: Print in-order values [1, 3, 5, 7, 8, 9]
     - **Doubled**: Map with `\x. x * 2`, print [2, 6, 10, 14, 16, 18]
     - **Sum**: Fold with `\a. \b. a + b` starting with 0, print sum (33)
     - **Depth**: Calculate tree depth (3)

expected_stdout: |
  Original: [1, 3, 5, 7, 8, 9]
  Doubled: [2, 6, 10, 14, 16, 18]
  Sum: 33
  Depth: 3

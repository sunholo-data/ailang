id: tree_transformation_pipeline
description: "Recursive tree transformations with higher-order functions and ADTs"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "very_hard"
expected_gain: "very_high"
timeout: 120  # Hard complexity: 120 seconds
task_prompt: |
  Implement a binary tree transformation pipeline in <LANG> with recursive operations and higher-order functions.

  **Task Requirements**:

  1. **Define a Tree type** with two variants:
     - Leaf: contains a single integer value
     - Node: contains left subtree, integer value, right subtree

  2. **Implement mapTree(fn, tree)**:
     - Recursively apply function to all values in tree
     - Return new tree with transformed values

  3. **Implement foldTree(fn, acc, tree)**:
     - In-order fold over tree values
     - Combine all values using the binary function

  4. **Implement treeToList(tree)**:
     - In-order traversal returning list of integers
     - Used for printing results

  5. **Implement treeDepth(tree)**:
     - Return maximum depth of tree (Leaf has depth 1)

  6. **Test with this tree structure**:
     ```
           4
          / \
         2   6
        / \ / \
       1  3 5  7
     ```
     This is: Node(Node(Leaf(1), 2, Leaf(3)), 4, Node(Leaf(5), 6, Leaf(7)))

  7. **Print these results** (each on its own line):
     - treeToList(tree): [1, 2, 3, 4, 5, 6, 7]
     - treeToList(mapTree(double, tree)): [2, 4, 6, 8, 10, 12, 14]
     - foldTree(add, 0, tree): 28
     - treeDepth(tree): 3

expected_stdout: |
  [1, 2, 3, 4, 5, 6, 7]
  [2, 4, 6, 8, 10, 12, 14]
  28
  3

id: multi_module_imports
description: "Multi-file module system with imports and effect composition"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO", "FS"]
difficulty: "hard"
expected_gain: "very_high"
timeout: 120  # Hard complexity: 120 seconds
task_prompt: |
  Create a multi-module program in <LANG> demonstrating imports and effect composition.

  <LANG=AILANG> **You MUST create THREE separate files in the benchmark/ directory**

  **CRITICAL**: Do NOT combine these into one file! The benchmark tests multi-file imports.

  **File 1: benchmark/data.ail**
  ```ailang
  module benchmark/data

  type User = { name: string, age: int, email: string }

  func validateEmail(email: string) -> bool =
    // Check if email contains "@"
    // Hint: you'll need to implement string contains check
    // For simplicity, just return true for this benchmark
    true
  ```

  **File 2: benchmark/storage.ail**
  ```ailang
  module benchmark/storage
  import benchmark/data (User)
  import std/io (readFile, writeFile)
  import std/json (encode, decode)

  func saveUser(user: User, filename: string) !: FS -> () =
    // Encode user to JSON string
    // Write to file
    let json = "{\"name\":\"" ++ user.name ++ "\",\"age\":" ++ show(user.age) ++ ",\"email\":\"" ++ user.email ++ "\"}" in
    writeFile(filename, json)

  func loadUser(filename: string) !: FS -> User =
    // Read file
    let content = readFile(filename) in
    // For this benchmark, manually parse the simple JSON
    // In real code, use std/json.decode
    // Return hardcoded user for simplicity
    { name: "Alice", age: 30, email: "alice@example.com" }
  ```

  **File 3: benchmark/solution.ail** (main entry point)
  ```ailang
  module benchmark/solution
  import benchmark/data (User, validateEmail)
  import benchmark/storage (saveUser, loadUser)
  import std/io (println)

  func main() !: IO,FS -> () =
    let user = { name: "Alice", age: 30, email: "alice@example.com" } in
    let valid = validateEmail(user.email) in
    let _ = println("Email valid: " ++ show(valid)) in
    let _ = saveUser(user, "user.json") in
    let loaded = loadUser("user.json") in
    println("Loaded: " ++ loaded.name ++ ", age " ++ show(loaded.age))
  ```

  **STEP-BY-STEP INSTRUCTIONS**:

  1. **First**, create benchmark/data.ail with module declaration and User type
  2. **Second**, create benchmark/storage.ail importing from benchmark/data
  3. **Third**, create benchmark/solution.ail importing from both modules
  4. **Verify** by running:
     ```
     ailang run --entry main --caps IO,FS benchmark/solution.ail
     ```
  5. **Check output** matches expected exactly

  **Common Mistakes to Avoid**:
  - ❌ Combining all code into one file
  - ❌ Wrong module declarations (must match file paths)
  - ❌ Missing imports
  - ❌ Effect signatures not matching (FS effect required for file I/O)

  <LANG=PYTHON>
  Create three files: data.py, storage.py, solution.py

  **File 1: data.py**
  ```python
  class User:
      def __init__(self, name, age, email):
          self.name = name
          self.age = age
          self.email = email

  def validateEmail(email):
      return "@" in email
  ```

  **File 2: storage.py**
  ```python
  import json
  from data import User

  def saveUser(user, filename):
      data = {
          "name": user.name,
          "age": user.age,
          "email": user.email
      }
      with open(filename, "w") as f:
          json.dump(data, f)

  def loadUser(filename):
      with open(filename, "r") as f:
          data = json.load(f)
      return User(data["name"], data["age"], data["email"])
  ```

  **File 3: solution.py** (main entry)
  ```python
  from data import User, validateEmail
  from storage import saveUser, loadUser

  def main():
      user = User("Alice", 30, "alice@example.com")
      valid = validateEmail(user.email)
      print(f"Email valid: {valid}")

      saveUser(user, "user.json")
      loaded = loadUser("user.json")
      print(f"Loaded: {loaded.name}, age {loaded.age}")

  if __name__ == "__main__":
      main()
  ```

expected_stdout: |
  Email valid: true
  Loaded: Alice, age 30

task_prompt: "Solve the following competitive programming problem in <LANG>.\nWrite a complete program that reads the input from standard input and writes the answer to standard output.\nBesides the example below, it is judged against 12 hidden tests (inputs up to 64KB), each with a 30 second time limit, so the algorithm must be efficient enough. Ignore the time limit stated in the problem.\n\n--- PROBLEM ---\nInput file: standard input \nOutput file: standard output \nTime limit: 1 second \nMemory limit: 1024 megabytes\nLittle Cyan Fish has a sequence of n positive integers $a_1, a_2, \\cdots, a_n$. Oscar Tang told Little Cyan Fish: “I want you to divide this sequence into several contiguous segments, where the profit of each segment is the product of all elements within that segment, and your task is to maximize the sum of all segment profits.” \nLittle Cyan Fish found this problem quite challenging. Therefore, Little Cyan Fish hopes that you will provide the answer modulo $(10^9 + 7)$ and tell him the result. \nInput \nEach test case contains multiple sets of test data. The first line of input contains an integer $T$ ($1 \\leq T \\leq 2 \\times 10^5$), indicating the number of test data sets. \nFor each test data set: \n- The first line contains a positive integer $n$ ($1 \\leq n \\leq 2 \\times 10^5$), which is the length of the sequence. \n- The second line contains $n$ positive integers $a_1, a_2, \\ldots, a_n$ ($1 \\leq a_i \\leq 10^9$). \n\nIt is guaranteed that the total sum of $n$ across all test data sets does not exceed $2 \\times 10^5$. \nOutput\nFor each test data set, output a single line containing an integer, representing the answer requested by Little Blue Fish, taken modulo $(10^9 + 7)$.\nExample\n3 \n4 \n2 3 3 3 \n5 \n1 2 1 2 1 \n6 \n1 1 4 5 1 4\nstandard output\n54\n7\n82\n--- END PROBLEM ---\n\nOutput only the code, no explanations.\n"

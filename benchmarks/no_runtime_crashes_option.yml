id: no_runtime_crashes_option
description: "Total functions: Option type prevents null pointer errors"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "very_high"
task_prompt: |
  Write a program in <LANG> that safely handles missing values using Option/Maybe types.

  Requirements:
  1. Define an Option type: Some(value) | None
  2. Implement `findFirst(predicate, list)` that returns:
     - Some(element) if an element matches predicate
     - None if no element matches
  3. Implement `mapOption(fn, option)` that applies fn to the value if Some, otherwise returns None
  4. Test with list [1, 2, 3, 4, 5]:
     - Find first even number -> Some(2)
     - Map double over it -> Some(4)
     - Print result: "Found: 4"
  5. Test with list [1, 3, 5]:
     - Find first even number -> None
     - Map double over it -> None
     - Print: "Not found"

  This demonstrates TOTALITY: no crashes, all cases handled explicitly.

  Expected output:
  "Found: 4"
  "Not found"

  Output only the code, no explanations.
expected_stdout: |
  Found: 4
  Not found

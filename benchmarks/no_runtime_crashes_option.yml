id: no_runtime_crashes_option
description: "Total functions: Option type prevents null pointer errors"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "very_high"
task_prompt: |
  Write a program in <LANG> that safely handles missing values using Option/Maybe types.

  Requirements:
  1. Define an Option type: Some(value) | None
  2. Implement `safeLast(list)` that returns:
     - Some(element) if list is non-empty (returns last element)
     - None if list is empty
  3. Implement `flatMapOption(fn, option)` that applies fn (which returns Option) to the value if Some, otherwise returns None
  4. Implement `safeHead(list)` that returns Some(first element) or None if empty
  5. Test with list ["apple", "banana", "cherry"]:
     - Get last element -> Some("cherry")
     - FlatMap safeHead over chars of that string (get first char) -> Some("c")
     - Print result: "Last starts with: c"
  6. Test with empty list []:
     - Get last element -> None
     - FlatMap anything -> None
     - Print: "Empty list"

  This demonstrates TOTALITY: no crashes, all cases handled explicitly.

  Expected output:
  "Last starts with: c"
  "Empty list"

  Output only the code, no explanations.
expected_stdout: |
  Last starts with: c
  Empty list

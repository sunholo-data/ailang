id: record_update
description: "Record update syntax {r | field: value}"
languages: ["python", "ailang", "moonbit", "aver"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "very_high"
task_prompt: |
  Write a program in <LANG> that:
  1. Creates a product record: {sku: "WDG-001", price: 29, inStock: true}
  2. Creates an updated version with price reduced by 5 (using record update syntax)
  3. Creates another update from the discounted version, setting inStock to false
  4. Prints all three records in format: "{sku}, {price}, {inStock}"

  Output only the code, no explanations.
expected_stdout: |
  WDG-001, 29, true
  WDG-001, 24, true
  WDG-001, 24, false
tier: smoke
tags: [records]

id: higher_order_functions
description: "Compose, map, filter, currying, partial application"
languages: ["python", "ailang", "javascript", "go", "moonbit", "aver"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "high"
task_prompt: |
  Write a program in <LANG> that demonstrates higher-order functions:

  1. Implement `pipe(f, g)` - returns a function that computes g(f(x)) (apply f first, then g)
  2. Implement `subtract(x, y)` - returns x - y
  3. Implement `negate(x)` - returns -x
  4. Create `sub4 = subtract(_, 4)` using partial application (or lambda) - subtracts 4 from input
  5. Create `double = multiply(2, _)` using partial application (or lambda)
  6. Create `sub4_then_double = pipe(sub4, double)` - subtract 4 first, then double
  7. Apply the piped function to 11
  8. Print the result: "Result: {value}"

  Expected computation: (11 - 4) * 2 = 14

  Requirements:
  - Use first-class functions
  - Demonstrate function piping (reverse of compose)
  - Show currying or partial application

  Output only the code, no explanations.
expected_stdout: |
  Result: 14
tier: core
tags: [functional]

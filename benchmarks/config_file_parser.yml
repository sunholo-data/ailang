id: config_file_parser
description: "Parse and validate JSON configuration file with error handling"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO", "FS"]
difficulty: "hard"
expected_gain: "very_high"
timeout: 90  # Medium complexity: 90 seconds
task_prompt: |
  Build a configuration file parser in <LANG> with validation and error handling.

  <LANG=AILANG> Write to: benchmark/solution.ail

  **Task Steps**:

  1. **Create JSON config file "app_config.json"** with this exact content:
     ```json
     {
       "app_name": "MyApp",
       "version": "1.0.0",
       "port": 8080,
       "features": ["logging", "auth", "api"]
     }
     ```

  2. **Define Config record type**:
     ```ailang
     type Config = {
       app_name: string,
       version: string,
       port: int,
       features: List[string]
     }
     ```

  3. **Implement loadConfig(filename: string) !: FS -> Config**:
     - Read file using std/io.readFile
     - Parse JSON using std/json.decode
     - Extract fields and build Config record
     - Validate:
       * port must be between 1024 and 65535
       * version must match "X.Y.Z" format (simple check: contains two dots)
       * features list must not be empty
     - Return Config record

  4. **Main function**:
     - Call loadConfig("app_config.json")
     - Print: "Loaded MyApp v1.0.0 on port 8080 with 3 features"
     - Format: "Loaded {app_name} v{version} on port {port} with {N} features"

  **AILANG Implementation Hints**:
  ```ailang

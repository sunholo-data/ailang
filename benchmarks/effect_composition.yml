id: effect_composition
description: "Effect composition and propagation in function signatures"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO", "FS"]
difficulty: "hard"
expected_gain: "very_high"
task_prompt: |
  Write a program in <LANG> that demonstrates effect composition.

  Requirements:
  1. Implement a PURE function `calculateTotal(price, quantity)` that returns price * quantity
  2. Implement a function `readPrice(filename)` that reads a number from a file (FS effect)
  3. Implement a function `displayOrder(product, total)` that prints "Order: {product} = ${total}" (IO effect)
  4. Implement a function `processOrder(product, priceFile, quantity)` that:
     - Calls readPrice(priceFile) to get unit price (FS effect)
     - Calls calculateTotal(price, quantity) to get total (pure)
     - Calls displayOrder(product, total) to print (IO effect)
     - This function has BOTH IO and FS effects

  Main should:
  - Create a test file "widget_price.txt" with content "15"
  - Call processOrder("Widget", "widget_price.txt", 4)

  Effect propagation:
  - processOrder has both IO and FS effects (because it calls functions with those effects)
  - Effect signatures should compose: FS + IO = both in signature

  Expected output:
  "Order: Widget = $60"

  Output only the code, no explanations.
expected_stdout: |
  Order: Widget = $60

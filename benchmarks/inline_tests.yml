id: inline_tests
description: "Write function with inline tests annotation (v0.4.7 feature)"
languages: ["python", "ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "medium"
expected_gain: "high"
task_prompt: |
  Write a program in <LANG> that:

  1. Defines a pure function `cube(n)` that returns n * n * n
     - In AILANG, annotate with inline tests: `pure func cube(n: int) -> int tests [(0, 0), (2, 8), (3, 27)] { ... }`

  2. Defines a pure function `isPositive(n)` that returns true if n > 0
     - In AILANG, annotate with inline tests: `pure func isPositive(n: int) -> bool tests [(5, true), (0, false), (-3, false)] { ... }`

  3. In main, call cube(4) and print the result

  Expected output: 64

  Note: In Python, just define the functions normally without inline test syntax.

  Output only the code, no explanations.
expected_stdout: |
  64
tier: smoke
tags: [contracts, functional]

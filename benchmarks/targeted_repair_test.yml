id: targeted_repair_test
description: "Fix broken AILANG code with common syntax errors"
languages: ["ailang"]
entrypoint: "main"
caps: ["IO"]
difficulty: "trivial"
expected_gain: "high"
task_prompt: |
  Fix the broken AILANG code below. The program should compute 2 + 2 and print the result (4).

  **Broken Code**:
  ```ailang
  import std/io (println);

  let main = {
    let result = 2 + 2;
    println(result);
  }
  ```

  **Task**: Identify and fix all syntax errors to make the code compile and run correctly.
expected_stdout: |
  4

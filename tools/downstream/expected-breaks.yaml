# Acknowledged breaks for `make downstream-check` (design §6.5). A breaking PR adds
# one entry per (corpus, normalised code) bucket it breaks; the gate (exit 2) then
# fails only on buckets nobody acknowledged or on counts above `max`. Entries that
# match nothing are reported UNUSED; entries past `expires` are reported stale.
#
# - change: "#2184 pure implies empty effect row"
#   code: EFFECT/pure-with-row     # the bucket name from the report
#   corpus: motoko-fork
#   max: 106
#   fix: "motoko fork#6"           # PR/issue that removes the breaks
#   republish: []                  # registry packages to re-publish first
#   expires: v0.58.1               # reported stale once the candidate is newer

# M-V1-MATCH-EXHAUSTIVENESS: a match that misses a case is TC_MATCH_002. Every
# site is a one-line arm (or catch-all) in the corpus; the patches check on both
# v0.60.0 and the candidate, so they can land in any order. `expires` is a
# version (the field takes no date): stale once a candidate is newer than
# v0.61.0 — remove these entries by 2026-12-02, when the corpus fixes have
# landed, so slack under `max` cannot hide a later TC_MATCH_002.
- change: "match exhaustiveness: non-exhaustive match is TC_MATCH_002"
  code: TC_MATCH_002
  corpus: daneel
  max: 3
  fix: "tools/video/daneel_video.ail:240 — StreamEvent match gains `_ => true`"
  republish: []
  expires: v0.61.0
# motoko-fork: fixed by sunholo-voight-kampff/motoko_agent#9 (merged 2026-11-12), so its
# entry is removed: left in place it reads UNUSED and the gate exits 2.
- change: "match exhaustiveness: non-exhaustive match is TC_MATCH_002"
  code: TC_MATCH_002
  corpus: ailang-packages
  max: 2
  fix: "packages/specstore/qa_test.ail:35 — inner list match gains the [] case"
  republish: []
  expires: v0.61.0

# #2210/#2221 record rows: a field the record lacks, read through a lambda, is
# TC_REC_001 at check. The three newly failing motoko-fork files are the DST
# ADR-001 probes that pin exactly this hole (scripts/dst/fixtures/adr001_boundary/
# missingport.ail, missingannot.ail, fs_missing.ail: "accepted by ailang check and
# fails only at invocation"); run_declared_vs_performed.sh LIMITATION 3/4/5 has a
# "IS FIXED UPSTREAM" branch for this. The other 3 in the bucket already failed
# and only gained the code (missingnamed, missingworld, the package dir).
- change: "#2210/#2221 record rows: missing field through a lambda is TC_REC_001"
  code: TC_REC_001
  corpus: motoko-fork
  max: 6
  fix: "motoko DST ADR-001 LIMITATION 3/4/5 probes flip to their FIXED UPSTREAM branch; re-read ADR fact 1 / 2(a)"
  republish: []
  expires: v0.61.0

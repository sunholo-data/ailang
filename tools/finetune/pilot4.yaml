# Fine-tune pilot-4 LoRA config (docs/docs/finetuning/pilot-4.md).
# Restarts from the PILOT-2 adapter (D-FT-13), not pilot-3's: pilot-2 has the protocol and the loop;
# pilot-3's adapter also learned to emit runaway writes (1.8% of responses dropped). The mix pools both
# rounds of on-policy repairs (pilot-2's and pilot-3's own mistakes, with loop-break episodes), build-up
# episodes for long files, and a replay sample. One epoch at 1e-5: the recipe that took pilot-3 from
# 4/24 to 10/24. pilot4_run.sh fills in __ITERS__ / __UPDATES__ and the adapter to resume from.
train: true
fine_tune_type: lora
mask_prompt: true
num_layers: -1                      # all blocks, as pilot-2 (the adapter shapes must match)
batch_size: 1
grad_accumulation_steps: 4
iters: __ITERS__
learning_rate: 1.0e-5               # half of pilot-2's 2e-5: continuing, not starting
lr_schedule:
  name: cosine_decay
  warmup: 30
  warmup_init: 1.0e-6
  arguments: [1.0e-5, __UPDATES__, 1.0e-7]
lora_parameters:
  rank: 32                          # must equal pilot-2's
  scale: 10.0
  dropout: 0.05
max_seq_length: 12288
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 200
val_batches: 50
save_every: 200
seed: 17

# GitHub Actions workflow for building and deploying Docusaurus site to GitHub Pages
name: Deploy Documentation to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "dev"]
    paths:
      - 'docs/**'
      - 'prompts/**'
      - 'llms.txt'
      - 'CHANGELOG.md'
      - '.github/workflows/docusaurus-deploy.yml'
      # Rebuild WASM when Go source changes
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      # Web assets (REPL component, etc.)
      - 'web/**'

  # PRs always run the gate; path decisions happen in docs-changes because a
  # path-filtered required workflow would remain Pending when no path matches.
  pull_request:
    branches: ["dev", "main"]

  # Rebuild daily to pick up newly published packages in the registry
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Separate PR refs after observed cross-PR cancellations; the deploy job alone
# retains the Pages singleton needed for production deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.detect.outputs.docs_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard docs path list against push-path drift
        run: |
          set -euo pipefail
          PUSH_PATHS=()
          while IFS= read -r push_path; do
            PUSH_PATHS+=("$push_path")
          done < <(
            awk '
              /^  push:$/ { in_push = 1; found_push = 1; next }
              /^  pull_request:$/ { in_push = 0 }
              in_push && /^      - '\''.*'\''$/ {
                path = $0
                sub(/^      - '\''/, "", path)
                sub(/'\''$/, "", path)
                print path
              }
              END {
                if (!found_push) {
                  exit 2
                }
              }
            ' .github/workflows/docusaurus-deploy.yml
          ) || {
            echo "::error::could not locate the on.push block"
            exit 1
          }

          if [ "${#PUSH_PATHS[@]}" -eq 0 ]; then
            echo "::error::on.push.paths is empty or could not be extracted"
            exit 1
          fi

          for push_path in "${PUSH_PATHS[@]}"; do
            case "$push_path" in
              */'**') pathspec="${push_path%/**}/" ;;
              *) pathspec="$push_path" ;;
            esac
            if ! grep -Fqx "$pathspec" .github/docs-build-paths.txt; then
              echo "::error::on.push.paths entry '$push_path' is not covered by docs pathspec '$pathspec'"
              exit 1
            fi
          done
          echo "docs path drift guard passed for ${#PUSH_PATHS[@]} push paths"

      - name: Detect docs-relevant changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            echo "event=$EVENT_NAME; docs_changed=true (full build trigger)"
            exit 0
          fi

          if [ -z "$BASE_REF" ]; then
            echo "::error::pull request base ref is empty"
            exit 1
          fi

          if ! git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            git fetch --no-tags origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fi
          if ! git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            echo "::error::cannot resolve origin/$BASE_REF"
            exit 1
          fi

          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::cannot determine merge base for origin/$BASE_REF and HEAD"
            exit 1
          fi

          PATHSPECS=()
          while IFS= read -r pathspec; do
            PATHSPECS+=("$pathspec")
          done < <(
            sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' \
              .github/docs-build-paths.txt
          )
          if [ "${#PATHSPECS[@]}" -eq 0 ]; then
            echo "::error::.github/docs-build-paths.txt contains no usable pathspecs"
            exit 1
          fi

          echo "Changed files since merge base $MERGE_BASE:"
          git diff --name-only "$MERGE_BASE" HEAD
          CHANGED=$(git diff --name-only "$MERGE_BASE" HEAD -- "${PATHSPECS[@]}")
          echo "Docs-filtered changed files:"
          printf '%s\n' "$CHANGED"

          if [ -n "$CHANGED" ]; then
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
            echo "docs_changed=true"
          else
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
            echo "docs_changed=false"
          fi

  # Docs build job
  docs-build:
    runs-on: ubuntu-latest
    needs: docs-changes
    # Run even if commit has [skip ci] when it's from docs automation
    if: >-
      needs.docs-changes.outputs.docs_changed == 'true' &&
      (!contains(github.event.head_commit.message, '[skip ci]') || github.actor == 'github-actions[bot]')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history and tags for version generation

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './docs/package-lock.json'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Install jq for stats generation
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build WASM binary
        run: make build-wasm

      # Native binary is needed by verify_examples.go (invoked transitively
      # by `make update-readme` below). Without this, the examples page
      # would ship with whatever examples.mdx was last committed.
      - name: Build native ailang binary
        run: make build

      - name: Copy static assets
        run: |
          mkdir -p docs/static/js docs/static/wasm
          cp llms.txt docs/static/
          cp bin/ailang.wasm docs/static/wasm/
          # Download wasm_exec.js from Go repository matching the build version
          GO_VERSION=$(go env GOVERSION)
          curl -sL -o docs/static/wasm/wasm_exec.js "https://raw.githubusercontent.com/golang/go/${GO_VERSION}/misc/wasm/wasm_exec.js"
          cp web/ailang-repl.js docs/static/js/
          cp web/AilangRepl.jsx docs/src/components/

      - name: Install dependencies
        run: make docs-install

      - name: Generate version constants
        run: bash docs/scripts/generate-version-constants.sh

      - name: Generate codebase statistics
        run: |
          # Use latest git tag for version (handles tags on other branches)
          export AILANG_VERSION=$(git tag --sort=-v:refname | head -1)
          bash tools/generate_codebase_stats.sh

      # Regenerate docs/docs/examples.mdx (the examples-status page) and
      # docs/static/badges/examples.json (consumed by a shields.io endpoint
      # badge in README.md). Runs ~ every example once; tolerable inside the
      # docs build since WASM already dominates wall time.
      #
      # We don't `git commit` anything here — the regenerated files are
      # consumed by `make docs-build` below and baked into the Pages artifact.
      # README.md in the dev tree stays static; the badge it points at is
      # the JSON we publish to Pages.
      - name: Regenerate examples status page + badge JSON
        run: |
          # Produce examples_report.json from the freshly-built ailang binary.
          # Intentionally does NOT call `make update-readme` in full: that
          # target also runs update_readme.go, which would clobber the
          # shields.io endpoint badge with a hardcoded one.
          go run ./scripts/verify_examples.go --json > examples_report.json || true

          # Feed the report into the examples-status page (baked into the
          # Docusaurus build; never committed).
          if [ -f examples_report.json ]; then
            go run ./scripts/update_docs_examples.go
          fi

          # Emit the JSON consumed by the shields.io endpoint badge in
          # README.md. Hosted under /badges/ on the docs site.
          mkdir -p docs/static/badges
          if [ -f examples_report.json ]; then
            jq '{
              schemaVersion: 1,
              label: "examples",
              message: "\(.passed) passing",
              color: (
                if .failed == 0 then "brightgreen"
                elif (.passed / .total_examples * 100) >= 80 then "green"
                elif (.passed / .total_examples * 100) >= 60 then "orange"
                else "red"
                end
              )
            }' examples_report.json > docs/static/badges/examples.json
            echo "Badge JSON:"
            cat docs/static/badges/examples.json
          else
            echo "::warning::examples_report.json not produced; badge not refreshed"
          fi

      - name: Sync teaching prompts
        run: bash docs/scripts/sync-prompts.sh

      - name: Sync package registry data
        run: bash docs/scripts/sync-registry.sh
        continue-on-error: true  # Build proceeds even if registry unavailable

      - name: Build Docusaurus site
        run: make docs-build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/build

  docs-gate:
    runs-on: ubuntu-latest
    needs: [docs-changes, docs-build]
    if: always()
    steps:
      - name: Adjudicate docs build
        env:
          DETECT_RESULT: ${{ needs.docs-changes.result }}
          DOCS_CHANGED: ${{ needs.docs-changes.outputs.docs_changed }}
          BUILD_RESULT: ${{ needs.docs-build.result }}
        run: |
          set -euo pipefail
          echo "detector=$DETECT_RESULT docs_changed=$DOCS_CHANGED docs-build=$BUILD_RESULT"

          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::docs-changes result=$DETECT_RESULT; cannot certify the docs build"
            exit 1
          fi

          case "$DOCS_CHANGED" in
            true)
              [ "$BUILD_RESULT" = "success" ] && exit 0
              echo "::error::docs-relevant paths changed but docs-build result=$BUILD_RESULT"
              exit 1 ;;
            false)
              [ "$BUILD_RESULT" = "skipped" ] && exit 0
              echo "::error::no docs-relevant paths changed but docs-build result=$BUILD_RESULT (expected skipped)"
              exit 1 ;;
            *)
              echo "::error::docs-changes produced an unusable docs_changed value: '$DOCS_CHANGED'"
              exit 1 ;;
          esac

  # Deployment job
  deploy:
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

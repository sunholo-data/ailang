name: Build and Release

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

# Least-privilege default. Individual jobs may override with `permissions:`
# blocks if they need to write (e.g. create releases, push commits).
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: ailang
            artifact_name: ailang-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_name: ailang
            artifact_name: ailang-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: ailang
            artifact_name: ailang-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: ailang.exe
            artifact_name: ailang-windows-amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.11'

    # uv pins the Python runtime for eval-harness tests. The harness invokes
    # `uv run --python <PinnedPythonVersion>` and fails loudly if uv is missing
    # (see internal/eval_harness/python.go). Must match ci.yml.
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    # Prepare the eval runner's pin before tests poison network access.
    # Keep this request in sync with PinnedPythonVersion in python.go.
    - name: Prefetch Python for offline eval-harness tests
      timeout-minutes: 5
      run: uv python install 3.12

    - name: Get dependencies
      run: go mod download all

    - name: Install ailang binary for integration tests
      run: go install ./cmd/ailang

    - name: Run tests
      shell: bash
      env:
        HTTP_PROXY: http://127.0.0.1:9
        HTTPS_PROXY: http://127.0.0.1:9
        NO_PROXY: localhost,127.0.0.1
        GOPROXY: off
      run: |
        [[ "$HTTP_PROXY" == "http://127.0.0.1:9" ]] || { echo "::error::HTTP_PROXY poison is not configured"; exit 1; }
        [[ "$HTTPS_PROXY" == "http://127.0.0.1:9" ]] || { echo "::error::HTTPS_PROXY poison is not configured"; exit 1; }
        [[ "$NO_PROXY" == "localhost,127.0.0.1" ]] || { echo "::error::NO_PROXY loopback bypass is not configured"; exit 1; }
        [[ "$GOPROXY" == "off" ]] || { echo "::error::GOPROXY is not disabled"; exit 1; }
        # -timeout 900s: the same DERIVED PROVISIONAL budget as ci.yml's test-windows job
        # (derivation in the comment on its "Run Go test suite" step). This step used Go's
        # default 600s, which cmd/ailang outgrew on windows-latest: it measured 451s and
        # 485s on dev, then 600s and 590s on one PR (2026-11-10) whose own new tests take
        # about 2s — the hang guard refused the package's last tests both times. The two
        # workflows had drifted; keep them in step. The durable fix is a faster cmd/ailang.
        go test -v -timeout 900s $(go list ./... | grep -v /scripts | grep -v /examples/agents)

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -v -o bin/${{ matrix.binary_name }} ./cmd/ailang

    - name: Create artifact directory
      run: mkdir -p artifacts

    - name: Prepare artifact (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cp bin/${{ matrix.binary_name }} artifacts/
        chmod +x artifacts/${{ matrix.binary_name }}
        cd artifacts && tar -czf ../${{ matrix.artifact_name }}.tar.gz ${{ matrix.binary_name }}

    - name: Prepare artifact (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Copy-Item bin\${{ matrix.binary_name }} artifacts\
        Compress-Archive -Path artifacts\${{ matrix.binary_name }} -DestinationPath ${{ matrix.artifact_name }}.zip

    - name: Upload artifact (Unix)
      if: matrix.os != 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.tar.gz

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.zip

  create-release-bundle:
    name: Create Release Bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts

    - name: Display structure
      run: ls -la ./artifacts/

    - name: Create combined bundle
      run: |
        mkdir -p bundle
        find ./artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} bundle/ \;
        cd bundle && tar -czf ../ailang-all-platforms.tar.gz *

    - name: Upload combined bundle
      uses: actions/upload-artifact@v7
      with:
        name: ailang-all-platforms
        path: ailang-all-platforms.tar.gz
        retention-days: 30

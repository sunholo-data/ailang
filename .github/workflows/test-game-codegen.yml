name: Test Game Codegen

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'internal/gen/**'
      - 'internal/elaborate/**'
      - 'internal/parser/**'
      - 'cmd/ailang/compile.go'
      - 'examples/sim_stub/**'
      - '.github/workflows/test-game-codegen.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'internal/gen/**'
      - 'internal/elaborate/**'
      - 'internal/parser/**'
      - 'cmd/ailang/compile.go'
      - 'examples/sim_stub/**'
      - '.github/workflows/test-game-codegen.yml'

permissions:
  contents: read

jobs:
  test-game-codegen:
    name: Test AILANG -> Go Codegen Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'

      - name: Build AILANG compiler
        run: make build

      - name: Install AILANG
        run: make install

      - name: Run sim_stub codegen test
        run: make test-sim-stub

# CodeQL — GitHub's native SAST. Catches taint-flow and API-misuse bugs
# that SonarCloud's surface-level pattern lint misses (e.g. path-traversal
# reaching a file open, user input reaching exec, SSRF). Results land in
# the GitHub Security tab alongside Scorecard SARIF.
#
# We already have SonarCloud on every push/PR inside ci.yml; CodeQL
# complements it with deeper semantic analysis and is the scanner that
# OpenSSF Scorecard's SAST check looks for by default.
name: CodeQL

on:
  # PRs are the gate (findings block before merge to dev); a weekly cron
  # re-scans unchanged code as the advisory DB updates. We deliberately do
  # NOT run on every `dev` push — that duplicated the PR scan and, at ~50
  # pushes/day from the autonomous harness, dominated repo clone traffic for
  # no added coverage. Use workflow_dispatch for an on-demand full scan.
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '17 6 * * 2'  # Tuesday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required to upload SARIF to the Security tab.
      security-events: write
      # Required for manual build steps on private repos (no-op here, safe).
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        # Single-language matrix for now. Add 'javascript' if/when we
        # want CodeQL to scan the docs site (docs/); currently
        # it is excluded from Sonar too — iteration-heavy docs components
        # aren't where the security surface lives.
        language: [go]
        build-mode: [autobuild]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds taint rules that security-and-quality
          # replaces with style noise; we want the taint rules, not the
          # style noise (Sonar already owns style).
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

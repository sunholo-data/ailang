name: Dashboard UI Build

# STUB. The dashboard UI (ui/) was removed — the dashboard is a headless API
# (design_docs/planned/m-dashboard-headless-api.md) — so there is nothing to
# build. This job is kept ONLY because the dev branch ruleset lists
# `UI build gate` as a required status check: delete this workflow together
# with that ruleset entry (an owner setting), never one without the other —
# a required check that no workflow reports blocks every PR.

on:
  pull_request:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-gate:
    name: UI build gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No UI to build
        run: echo "No dashboard UI in this repository; this check is kept for the dev ruleset only."

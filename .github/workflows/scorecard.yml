# OpenSSF Scorecard — supply-chain security scoring.
# Publishes to the GitHub Security tab and to api.securityscorecards.dev,
# which backs the public badge on the README.
name: Scorecard supply-chain security

on:
  # Scorecard measures repo-level supply-chain posture (branch protection,
  # pinned deps, token permissions) that barely changes commit-to-commit, so
  # the weekly cron is the right cadence. Running on every `dev` push added
  # ~28 redundant runs/day (each an actions/checkout) with no score movement.
  # Use workflow_dispatch to refresh the public badge on demand after a
  # security-posture change.
  schedule:
    - cron: '30 6 * * 1'  # Monday 06:30 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload SARIF results to the GitHub Security tab.
      security-events: write
      # Needed for Scorecard to read branch protection and other config.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish score to api.securityscorecards.dev so the README badge works.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

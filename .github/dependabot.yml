version: 2
updates:
  # Go modules — shipped binary. Group patches so PRs don't fragment.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/protobuf*"
      patches:
        update-types:
          - patch

  # GitHub Actions — keep our workflow actions pinned to current patched majors.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # Docusaurus build dependencies. Dev tooling, not shipped — allow Dependabot
  # to batch these into weekly grouped PRs so they don't drown us in alerts.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"
          - "@mermaid-js/*"
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Webpack 5.106 tightened the ProgressPlugin schema in a way Docusaurus
      # 3.10 doesn't match — skip until Docusaurus catches up.
      - dependency-name: "webpack"

  # Control-plane / collab-hub UI. Shipped React app.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "rollup"
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Vite/React major bumps need coordinated ecosystem upgrades (plugin-react,
      # @types/react-dom) Dependabot can't bundle — do these manually.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are how new AILANG capabilities are born. Accepted requests
        become design docs, which AI agents implement through our sprint pipeline.
        Focus on the *use case* — the "what and why" — not the implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: "Describe the use case or pain point"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: "How would you like this to work? Syntax examples, CLI behavior, etc."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Other approaches you've thought about"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language Syntax / Semantics
        - Type System
        - Effect System
        - Standard Library
        - CLI / Tooling
        - REPL
        - AI Integration
        - Documentation
        - Editor Support
        - Package System
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Examples from other languages, related issues, etc."

name: Bug Report
description: Report a bug in AILANG
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This will be triaged and may become a design doc
        that an AI agent implements. The more detail you provide, the faster the fix.
  - type: input
    id: version
    attributes:
      label: AILANG Version
      description: "Output of `ailang --version`"
      placeholder: "v0.9.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Parser / Lexer
        - Type System / Type Inference
        - Effect System
        - Runtime / Evaluator
        - Standard Library
        - CLI / REPL
        - Package System
        - Documentation
        - Build / Install
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: "Minimal AILANG code or CLI commands that trigger the bug"
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "Include error messages, stack traces, or incorrect output"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Architecture
      placeholder: "macOS ARM64, Linux x64, Windows x64, etc."
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Anything else? Related issues, workarounds, etc."

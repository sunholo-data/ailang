<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="AILANG Z3 Contract Verification Pipeline">
  <defs>
    <marker id="arr-z1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arr-z2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c7a7b"/>
    </marker>
    <marker id="arr-z3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e73c17"/>
    </marker>
  </defs>

  <rect width="880" height="360" rx="14" fill="#0f1420"/>
  <rect x="1" y="1" width="878" height="358" rx="13" fill="none" stroke="#233044" stroke-width="1.5"/>

  <text x="32" y="36" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Z3 Contract Verification Pipeline (ailang verify)</text>
  <text x="32" y="55" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Static SMT proofs for requires / ensures contracts with canonical AILANG counterexample replay</text>

  <!-- Step 1: Contracts -->
  <rect x="28" y="88" width="204" height="176" rx="10" fill="#172033" stroke="#2b6cb0" stroke-width="2"/>
  <rect x="28" y="88" width="204" height="28" rx="10" fill="#2b6cb0"/>
  <rect x="28" y="106" width="204" height="10" fill="#2b6cb0"/>
  <text x="130" y="107" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1. AILANG Contracts</text>
  <text x="40" y="138" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#93c5fd">pure func clamp(n: int)</text>
  <text x="40" y="156" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#fde047">  requires { n &gt;= 0 }</text>
  <text x="40" y="174" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#5eead4">  ensures  { result &lt;= 100 }</text>
  <line x1="40" y1="192" x2="218" y2="192" stroke="#334155" stroke-width="1"/>
  <text x="40" y="214" font-family="Inter, sans-serif" font-size="10.5" fill="#cbd5e1">Supports: int, float, bool,</text>
  <text x="40" y="232" font-family="Inter, sans-serif" font-size="10.5" fill="#cbd5e1">string, ADTs, records,</text>
  <text x="40" y="250" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#93c5fd">() Tuple0 &amp; Tuple2..8</text>

  <line x1="232" y1="176" x2="268" y2="176" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arr-z1)"/>

  <!-- Step 2: SMT Lowering -->
  <rect x="276" y="88" width="186" height="176" rx="10" fill="#172033" stroke="#6b46c1" stroke-width="2"/>
  <rect x="276" y="88" width="186" height="28" rx="10" fill="#6b46c1"/>
  <rect x="276" y="106" width="186" height="10" fill="#6b46c1"/>
  <text x="369" y="107" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2. Core ANF → SMT-LIB</text>
  <text x="288" y="140" font-family="Inter, sans-serif" font-size="11" fill="#e2e8f0">• Bounded recursion unroll</text>
  <text x="288" y="162" font-family="Inter, sans-serif" font-size="11" fill="#e2e8f0">• Default: unbounded Int</text>
  <text x="288" y="184" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#c4b5fd">• --int-model=int64</text>
  <text x="288" y="206" font-family="Inter, sans-serif" font-size="11" fill="#e2e8f0">• Opaque helper tagging</text>
  <text x="288" y="226" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">(helpers_not_checked)</text>
  <text x="288" y="250" font-family="Inter, sans-serif" font-size="10.5" fill="#c4b5fd">Negates ensures to seek bug</text>

  <line x1="462" y1="176" x2="498" y2="176" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arr-z1)"/>

  <!-- Step 3: Z3 Solver -->
  <rect x="506" y="120" width="102" height="112" rx="10" fill="#1a1826" stroke="#dd6b20" stroke-width="2.2"/>
  <text x="557" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#fdba74">Z3</text>
  <text x="557" y="184" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">SMT Solver</text>
  <text x="557" y="206" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">--json</text>

  <!-- Branch Arrows 3 -> Results -->
  <path d="M 608 150 L 650 132" fill="none" stroke="#2c7a7b" stroke-width="2.2" marker-end="url(#arr-z2)"/>
  <path d="M 608 202 L 650 222" fill="none" stroke="#e73c17" stroke-width="2.2" marker-end="url(#arr-z3)"/>

  <!-- Result A: UNSAT = Verified -->
  <rect x="658" y="88" width="194" height="82" rx="10" fill="#0f292a" stroke="#2c7a7b" stroke-width="2"/>
  <text x="672" y="112" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#5eead4">✓ UNSAT → Verified</text>
  <text x="672" y="133" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">No violating input exists</text>
  <text x="672" y="152" font-family="JetBrains Mono, monospace" font-size="10" fill="#99f6e4">Reports any caveats explicitly</text>

  <!-- Result B: SAT = Counterexample -->
  <rect x="658" y="184" width="194" height="84" rx="10" fill="#2b1416" stroke="#e73c17" stroke-width="2"/>
  <text x="672" y="208" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">✗ SAT → Counterexample</text>
  <text x="672" y="229" font-family="Inter, sans-serif" font-size="11" fill="#fecaca">Rendered in AILANG syntax</text>
  <text x="672" y="248" font-family="JetBrains Mono, monospace" font-size="10" fill="#fca5a5">Ready to paste into tests []</text>

  <!-- Footer -->
  <rect x="28" y="294" width="824" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="440" y="319" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">
    <tspan font-weight="700" fill="#93c5fd">Runtime option:</tspan> ailang run --verify-contracts checks requires/ensures dynamically on the reference evaluator (CTR004 on --bytecode).
  </text>
</svg>

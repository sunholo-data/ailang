<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="AILANG Agent Knowledge and Verification Stack">
  <defs>
    <marker id="arr-a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="880" height="360" rx="14" fill="#0f1420"/>
  <rect x="1" y="1" width="878" height="358" rx="13" fill="none" stroke="#233044" stroke-width="1.5"/>

  <text x="32" y="36" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Agent Knowledge &amp; Verification Stack</text>
  <text x="32" y="55" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Four deterministic layers let coding agents discover syntax, X-ray modules, auto-repair, and verify output</text>

  <!-- Layer 1 -->
  <rect x="32" y="76" width="816" height="58" rx="9" fill="#1e1633" stroke="#6b46c1" stroke-width="2"/>
  <rect x="32" y="76" width="168" height="58" rx="9" fill="#6b46c1"/>
  <rect x="184" y="76" width="16" height="58" fill="#6b46c1"/>
  <text x="116" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">1. Discovery</text>
  <text x="116" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#e9d5ff">Before coding</text>
  <text x="216" y="100" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#e9d5ff">ailang prompt  ·  /llms.txt  ·  /llms-full.txt  ·  Hosted MCP</text>
  <text x="216" y="120" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Load current teaching prompt, stdlib signatures, and runnable examples via CLI or mcp.ailang.sunholo.com/mcp/</text>

  <!-- Layer 2 -->
  <rect x="32" y="146" width="816" height="58" rx="9" fill="#172033" stroke="#2b6cb0" stroke-width="2"/>
  <rect x="32" y="146" width="168" height="58" rx="9" fill="#2b6cb0"/>
  <rect x="184" y="146" width="16" height="58" fill="#2b6cb0"/>
  <text x="116" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">2. Semantic X-Ray</text>
  <text x="116" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#dbeafe">&lt;100ms context</text>
  <text x="216" y="170" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#93c5fd">ailang inspect --format=agent  ·  ailang docs  ·  ailang iface</text>
  <text x="216" y="190" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Extract exports, types, effects, and contracts without burning context tokens on full implementation bodies</text>

  <!-- Layer 3 -->
  <rect x="32" y="216" width="816" height="58" rx="9" fill="#2b1416" stroke="#e73c17" stroke-width="2"/>
  <rect x="32" y="216" width="168" height="58" rx="9" fill="#e73c17"/>
  <rect x="184" y="216" width="16" height="58" fill="#e73c17"/>
  <text x="116" y="242" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">3. Static Repair</text>
  <text x="116" y="260" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#fee2e2">Compile loop</text>
  <text x="216" y="240" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#fca5a5">ailang check --format=agent  ·  check --fix  ·  _? holes  ·  ailang lsp</text>
  <text x="216" y="260" font-family="Inter, sans-serif" font-size="11" fill="#fecaca">Auto-stamp missing ! {Effects}, rewrite ++ to "${...}", query hole types, and generate exhaustive match stubs</text>

  <!-- Layer 4 -->
  <rect x="32" y="286" width="816" height="58" rx="9" fill="#0f292a" stroke="#2c7a7b" stroke-width="2"/>
  <rect x="32" y="286" width="168" height="58" rx="9" fill="#2c7a7b"/>
  <rect x="184" y="286" width="16" height="58" fill="#2c7a7b"/>
  <text x="116" y="312" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">4. Proof &amp; Replay</text>
  <text x="116" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#ccfbf1">Verify &amp; execute</text>
  <text x="216" y="310" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#5eead4">ailang verify --json  ·  ailang test  ·  ailang run --emit-trace jsonl</text>
  <text x="216" y="330" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Prove contracts with Z3, run inline property tests, and capture replayable JSONL traces for targeted fixes</text>
</svg>
